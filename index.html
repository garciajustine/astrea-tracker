`;

document.getElementById('tab-personal').innerHTML = PANEL_TEMPLATE('personal', 'personal');
document.getElementById('tab-shared').innerHTML = PANEL_TEMPLATE('shared', 'shared');

const CONFIG_KEY = 'expense-dashboard-config-pink';

const DEFAULT_CONFIG = null;

function getConfig() {
  try {
    const stored = JSON.parse(localStorage.getItem(CONFIG_KEY));
    if (stored && stored.url && stored.pass) return stored;
  } catch (e) {}
  return DEFAULT_CONFIG;
}
function saveConfig(cfg) { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }
function clearConfig() { localStorage.removeItem(CONFIG_KEY); }

async function apiCall(action, key, value) {
  const cfg = getConfig();
  if (!cfg) throw new Error('not configured');
  const params = new URLSearchParams({ action, pass: cfg.pass });
  if (key !== undefined) params.set('key', key);
  if (value !== undefined) params.set('value', value);
  const res = await fetch(cfg.url + '?' + params.toString(), { method: 'GET' });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

const storage = {
  async get(key) {
    const d = await apiCall('get', key);
    return (d.value !== null && d.value !== undefined) ? { value: d.value } : null;
  },
  async set(key, value) {
    await apiCall('set', key, value);
    return { key, value };
  }
};

document.getElementById('cfg-connect').addEventListener('click', async () => {
  const url = document.getElementById('cfg-url').value.trim();
  const pass = document.getElementById('cfg-pass').value;
  const errEl = document.getElementById('setup-error');
  errEl.textContent = '';
  if (!url || !pass) { errEl.textContent = 'Enter both the web app URL and your passphrase.'; return; }
  const btn = document.getElementById('cfg-connect');
  btn.textContent = 'Connecting…';
  try {
    const pingParams = new URLSearchParams({ action: 'ping', pass });
    const res = await fetch(url + '?' + pingParams.toString(), { method: 'GET' });
    const data = await res.json();
    if (data.error) throw new Error(data.error === 'unauthorized' ? 'Wrong passphrase.' : data.error);
    saveConfig({ url, pass });
    document.getElementById('setup-gate').style.display = 'none';
    document.getElementById('app-content').classList.add('ready');
    startApp();
  } catch (e) {
    errEl.textContent = 'Could not connect: ' + e.message + '. Check the URL and passphrase.';
  } finally {
    btn.textContent = 'Connect';
  }
});

document.getElementById('reset-config').addEventListener('click', () => {
  if (confirm('Disconnect this browser from your sheet? You can reconnect anytime with the same URL and passphrase.')) {
    clearConfig();
    location.reload();
  }
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    document.body.dataset.tab = btn.dataset.tab;
  });
});

const SEEDS = {
  personal: { month: '2026-11', items: [] },
  shared: { month: '2026-11', items: [] }
};

function makeTracker(id, kind) {
  const MONTH_LIST_KEY = 'expense-months-list:' + kind;
  const monthKeyFn = (m) => 'expenses:' + kind + ':' + m;
  const LEGACY_MONTH_LIST_KEY = kind === 'personal' ? 'expense-months-list' : null;
  const legacyMonthKeyFn = (m) => 'expenses:' + m;

  const state = { months: [], currentMonth: SEEDS[kind].month, items: [], idCounter: 1, selectedMoveId: null, loaded: false, loadFailed: false, monthsTrusted: false };

  function uid() { return id + '_' + (state.idCounter++) + '_' + Date.now().toString(36); }

  function monthLabel(key) {
    const [y, m] = key.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  function todayStr() {
    const d = new Date();
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function loadMonthsList() {
    // Retry a few times before giving up — on a fresh boot the first fetch can
    // fail (Wi-Fi/network not fully up, Apps Script cold start) and we must not
    // mistake that for "no months saved yet".
    const MAX_ATTEMPTS = 3;
    let confirmed = false;
    for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
      try {
        const res = await storage.get(MONTH_LIST_KEY, false);
        confirmed = true;
        if (res && res.value) return { months: JSON.parse(res.value), ok: true };
        break; // reached the server; it genuinely has no value for this key yet
      } catch (e) {
        if (attempt < MAX_ATTEMPTS) await new Promise(r => setTimeout(r, 500 * attempt));
      }
    }
    if (LEGACY_MONTH_LIST_KEY) {
      try {
        const res = await storage.get(LEGACY_MONTH_LIST_KEY, false);
        confirmed = true;
        if (res && res.value) return { months: JSON.parse(res.value), ok: true };
      } catch (e) {}
    }
    // ok: false means we never got a confirmed response from the server —
    // caller must NOT treat this as "no months" and must NOT save over it.
    return { months: null, ok: confirmed };
  }

  async function saveMonthsList() {
    try { await storage.set(MONTH_LIST_KEY, JSON.stringify(state.months), false); } catch (e) {}
  }

  // ok:false = never got a confirmed answer from the server (do NOT treat as "no data").
  async function fetchMonth(key) {
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        let res = await storage.get(monthKeyFn(key), false);
        if (!(res && res.value) && LEGACY_MONTH_LIST_KEY) res = await storage.get(legacyMonthKeyFn(key), false);
        const items = (res && res.value) ? JSON.parse(res.value).map(it => ({ ...it, id: it.id || uid() })) : null;
        return { ok: true, items };
      } catch (e) {
        if (attempt < 3) await new Promise(r => setTimeout(r, 500 * attempt));
      }
    }
    return { ok: false, items: null };
  }
  async function loadMonth(key) { return (await fetchMonth(key)).items; }

  // Editing is only allowed once this month was really loaded (or the user explicitly starts it).
  function ensureLoaded() {
    if (state.loaded) return true;
    if (state.loadFailed) { alert('Could not load this month from your sheet, so editing is paused to protect your data. Tap Sync to retry.'); return false; }
    if (confirm('No saved data was found for this month. If you expect data here, tap Sync first. Start it fresh?')) { state.loaded = true; return true; }
    return false;
  }

  async function saveMonth(key, data) {
    try {
      await storage.set(monthKeyFn(key), JSON.stringify(data), false);
      flashSaved();
    } catch (e) {
      document.getElementById(id + '-save-note').textContent = 'Could not save — check connection';
    }
  }

  let flashTimer = null;
  function flashSaved() {
    const note = document.getElementById(id + '-save-note');
    note.textContent = 'Saved just now';
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { note.textContent = 'Saved automatically to this browser'; }, 1800);
  }

  function peso(n) {
    return '\u20b1' + Number(n || 0).toLocaleString('en-PH', { maximumFractionDigits: 2 });
  }

  function renderMonthSelect() {
    const sel = document.getElementById(id + '-month-select');
    sel.innerHTML = '';
    state.months.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = monthLabel(m);
      if (m === state.currentMonth) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function renderStats() {
    const total = state.items.reduce((s, i) => s + Number(i.amount || 0), 0);
    const paidTotal = state.items.filter(i => i.paid).reduce((s, i) => s + Number(i.amount || 0), 0);
    const remaining = total - paidTotal;
    const pct = total > 0 ? Math.round((paidTotal / total) * 100) : 0;

    document.getElementById(id + '-stat-total').textContent = peso(total);
    document.getElementById(id + '-stat-count').textContent = state.items.length + (state.items.length === 1 ? ' item' : ' items');
    document.getElementById(id + '-stat-paid').textContent = peso(paidTotal);
    document.getElementById(id + '-stat-remaining').textContent = peso(remaining);
    document.getElementById(id + '-stat-pct').textContent = pct + '% paid';
    document.getElementById(id + '-progress-fill').style.width = pct + '%';
    document.getElementById(id + '-month-title').textContent = monthLabel(state.currentMonth);
  }

  function renderInstallments() {
    const container = document.getElementById(id + '-installments');
    if (!container) return;
    const items = state.items.filter(i => i.isInstallment);
    if (!items.length) {
      container.innerHTML = '<p class="inst-empty">No installments yet. Click "+ Installment" under any expense to track payments made.</p>';
      return;
    }
    container.innerHTML = items.map(item => {
      const total = item.instTotal;
      const paidCount = item.instPaid || 0;
      const pct = total ? Math.min(100, Math.round((paidCount / total) * 100)) : 0;
      return `
        <div class="inst-item">
          <p class="inst-item-name">${escapeAttr(item.name || '(unnamed)')}</p>
          <div class="inst-item-row"><span>${paidCount} / ${total || '?'} payments</span><span>${total ? pct + '%' : ''}</span></div>
          <div class="inst-progress-track"><div class="inst-progress-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    }).join('');
  }

  // A due date is really "this day of the month": move it into the month being viewed (31st -> last day of shorter months)
  function shiftToMonth(dateStr, monthKey) {
    const parts = (dateStr || '').split('-');
    if (parts.length !== 3 || !/^\d{4}-\d{2}$/.test(monthKey || '')) return dateStr;
    if (`${parts[0]}-${parts[1]}` === monthKey) return dateStr;
    const [y, m] = monthKey.split('-').map(Number);
    const day = Math.min(parseInt(parts[2], 10) || 1, new Date(y, m, 0).getDate());
    return monthKey + '-' + String(day).padStart(2, '0');
  }

  function dayOfMonth(dateStr) {
    if (!dateStr) return null;
    const parts = dateStr.split('-');
    if (parts.length !== 3) return null;
    const [y, m] = parts;
    if (`${y}-${m}` !== state.currentMonth) return null;
    return parseInt(parts[2], 10);
  }

  function renderCalendar() {
    const grid = document.getElementById(id + '-cal-grid');
    const titleEl = document.getElementById(id + '-cal-title');
    const hintEl = document.getElementById(id + '-cal-hint');
    if (!grid) return;
    titleEl.textContent = monthLabel(state.currentMonth);

    const [y, m] = state.currentMonth.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstWeekday = new Date(y, m - 1, 1).getDay();

    const dueMap = {};
    state.items.forEach(item => {
      const d = dayOfMonth(item.dueDate);
      if (d) { (dueMap[d] = dueMap[d] || []).push(item); }
    });

    const armedItem = state.selectedMoveId ? getItem(state.selectedMoveId) : null;
    const armedDay = armedItem ? dayOfMonth(armedItem.dueDate) : null;

    let html = ['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < firstWeekday; i++) html += '<div class="cal-day"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const due = dueMap[day];
      const classes = ['cal-day'];
      if (due) classes.push('has-due');
      if (armedDay === day) classes.push('armed');
      html += `<div class="${classes.join(' ')}" data-day="${day}">${day}${due ? `<div class="cal-dot"></div>` : ''}</div>`;
    }
    grid.innerHTML = html;

    if (armedItem) {
      hintEl.textContent = `Moving "${armedItem.name || '(unnamed)'}" — click a new date, or click its current date again to cancel.`;
      hintEl.classList.add('armed-hint');
    } else {
      hintEl.textContent = 'Click a due date, then click a new date to move it.';
      hintEl.classList.remove('armed-hint');
    }
  }

  document.getElementById(id + '-cal-grid').addEventListener('click', (e) => {
    const cell = e.target.closest('.cal-day');
    if (!cell || !cell.dataset.day) return;
    const day = parseInt(cell.dataset.day, 10);
    const [y, m] = state.currentMonth.split('-').map(Number);
    const clickedDate = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

    if (state.selectedMoveId) {
      const item = getItem(state.selectedMoveId);
      state.selectedMoveId = null;
      if (item) {
        item.dueDate = clickedDate;
        renderRows();
        persist();
      }
      renderCalendar();
      return;
    }

    const dueItems = state.items.filter(i => dayOfMonth(i.dueDate) === day);
    if (!dueItems.length) return;
    if (dueItems.length === 1) {
      state.selectedMoveId = dueItems[0].id;
    } else {
      const list = dueItems.map((it, idx) => `${idx + 1}. ${it.name || '(unnamed)'}`).join('\n');
      const choice = window.prompt(`Multiple expenses due this day — enter a number to move one:\n${list}`);
      const idx = parseInt(choice, 10) - 1;
      if (dueItems[idx]) state.selectedMoveId = dueItems[idx].id;
    }
    renderCalendar();
  });

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function formatDueDate(dateStr) {
    const parts = (dateStr || '').split('-');
    if (parts.length !== 3) return dateStr;
    const [y, m, d] = parts.map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderRows() {
    const container = document.getElementById(id + '-rows');
    container.innerHTML = '';
    state.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'row' + (item.paid ? ' is-paid' : '');
      row.dataset.id = item.id;
      row.draggable = true;
      row.innerHTML = `
        <div class="drag-handle" data-field="drag" aria-label="Drag to reorder" title="Drag to reorder">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
        </div>
        <div class="name-cell">
          <input type="text" value="${escapeAttr(item.name)}" data-field="name" placeholder="Expense name" />
          <div class="due-tag">
            <input type="text" value="${escapeAttr(item.due || '')}" data-field="due" placeholder="Notes" />
            <span class="due-chip">${item.dueDate ? 'Due ' + formatDueDate(item.dueDate).replace(/,\s*\d{4}$/, '') : ''}</span>
          </div>
          <div class="inst-toggle ${item.isInstallment ? 'on' : ''}" data-field="instToggle">${item.isInstallment ? '&#10003; Installment' : '+ Installment'}</div>
          ${item.isInstallment ? `
          <div class="inst-row-fields">
            <input type="number" min="0" value="${item.instPaid || 0}" data-field="instPaid" title="Payments made" />
            <span>/</span>
            <input type="number" min="0" value="${item.instTotal || ''}" data-field="instTotal" placeholder="total" title="Total payments" />
            <span>paid</span>
          </div>` : ''}
        </div>
        <div class="amount-cell">
          <span>&#8369;</span>
          <input type="text" inputmode="decimal" autocomplete="off" value="${fmtMoney(item.amount)}" data-field="amount" aria-label="Amount" />
        </div>
        <div class="paid-cell">
          <div class="checkbox ${item.paid ? 'checked' : ''}" data-field="paid">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0b2620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <span class="paid-label">${item.paid ? 'Paid' : 'Unpaid'}</span>
        </div>
        <div class="date-cell ${item.paidDate ? '' : 'empty'}">
          <input type="text" value="${escapeAttr(item.paidDate || '')}" data-field="paidDate" placeholder="—" />
        </div>
        <div class="row-actions">
          <button class="more-btn" data-menu aria-label="More options" aria-haspopup="menu" aria-expanded="false" title="More">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
          <div class="row-menu" role="menu">
            <label class="menu-item due-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
              <span>Due date</span>
              <input type="date" value="${escapeAttr(item.dueDate || '')}" data-field="dueDate" aria-label="Payment due date" />
            </label>
            <button class="menu-item act-btn" data-act="copy" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copy name</span></button>
            <button class="menu-item act-btn" data-act="dup" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span>Duplicate</span></button>
            <div class="menu-sep"></div>
            <button class="menu-item del-btn danger" data-field="delete" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><span>Delete</span></button>
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function getItem(itemId) { return state.items.find(i => i.id === itemId); }

  let dragId = null;

  document.getElementById(id + '-rows').addEventListener('dragstart', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    dragId = row.dataset.id;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  });

  document.getElementById(id + '-rows').addEventListener('dragend', (e) => {
    const row = e.target.closest('.row');
    if (row) row.classList.remove('dragging');
    document.querySelectorAll('#' + id + '-rows .row').forEach(r => {
      r.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    dragId = null;
  });

  document.getElementById(id + '-rows').addEventListener('dragover', (e) => {
    const row = e.target.closest('.row');
    if (!row || row.dataset.id === dragId) return;
    e.preventDefault();
    const rect = row.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    row.classList.toggle('drag-over-top', before);
    row.classList.toggle('drag-over-bottom', !before);
  });

  document.getElementById(id + '-rows').addEventListener('dragleave', (e) => {
    const row = e.target.closest('.row');
    if (row) row.classList.remove('drag-over-top', 'drag-over-bottom');
  });

  document.getElementById(id + '-rows').addEventListener('drop', (e) => {
    const row = e.target.closest('.row');
    if (!row || !dragId || row.dataset.id === dragId) return;
    e.preventDefault();
    const rect = row.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    row.classList.remove('drag-over-top', 'drag-over-bottom');

    const fromIdx = state.items.findIndex(i => i.id === dragId);
    let toIdx = state.items.findIndex(i => i.id === row.dataset.id);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = state.items.splice(fromIdx, 1);
    toIdx = state.items.findIndex(i => i.id === row.dataset.id);
    state.items.splice(before ? toIdx : toIdx + 1, 0, moved);

    renderRows();
    persist();
  });

  const pendingSaves = {}; let saveRunning = false;
  async function persist() {
    if (!state.loaded) {
      document.getElementById(id + '-save-note').textContent = 'Not saved — this month has not loaded. Tap Sync.';
      return;
    }
    pendingSaves[state.currentMonth] = state.items; // latest wins
    if (saveRunning) return;
    saveRunning = true;
    try {
      while (Object.keys(pendingSaves).length) {
        const k = Object.keys(pendingSaves)[0];
        const data = pendingSaves[k]; delete pendingSaves[k];
        await saveMonth(k, data);
      }
    } finally { saveRunning = false; }
  }


  document.getElementById(id + '-rows').addEventListener('input', (e) => {
    const field = e.target.dataset.field;
    if (!field) return;
    const row = e.target.closest('.row');
    const item = getItem(row.dataset.id);
    if (!item) return;
    if (field === 'amount') item.amount = liveMoney(e.target);
    else if (field === 'instPaid') item.instPaid = parseInt(e.target.value, 10) || 0;
    else if (field === 'instTotal') item.instTotal = e.target.value === '' ? null : (parseInt(e.target.value, 10) || 0);
    else if (field === 'dueDate') {
      item.dueDate = e.target.value;
      const chip = row.querySelector('.due-chip');
      if (chip) chip.textContent = item.dueDate ? 'Due ' + formatDueDate(item.dueDate).replace(/,\s*\d{4}$/, '') : '';
      if (typeof closeRowMenus === 'function') closeRowMenus();
      const wrap = e.target.closest('.date-picker-wrap');
      if (wrap) {
        wrap.classList.toggle('has-date', !!item.dueDate);
        wrap.title = item.dueDate ? formatDueDate(item.dueDate) : 'Set due date';
      }
    }
    else item[field] = e.target.value;
    renderStats();
    renderInstallments();
    renderCalendar();
    persist();
  });

  document.getElementById(id + '-rows').addEventListener('focusout', (e) => {
    if (e.target.dataset.field !== 'amount') return;
    const row = e.target.closest('.row'); const item = row && getItem(row.dataset.id);
    if (item) e.target.value = fmtMoney(item.amount);
  });

  document.getElementById(id + '-rows').addEventListener('click', (e) => {
    const checkbox = e.target.closest('.checkbox');
    const delBtn = e.target.closest('.del-btn');
    const instToggle = e.target.closest('.inst-toggle');
    const actBtn = e.target.closest('.act-btn');
    if (actBtn) {
      const item = getItem(actBtn.closest('.row').dataset.id);
      if (!item) return;
      if (actBtn.dataset.act === 'copy') {
        const note = document.getElementById(id + '-save-note');
        const done = () => { const prev = note.textContent; note.textContent = 'Copied \u201c' + (item.name || '') + '\u201d'; setTimeout(() => { note.textContent = prev; }, 1500); };
        try { navigator.clipboard.writeText(item.name || '').then(done).catch(() => {}); } catch (err) {}
        return;
      }
      if (!ensureLoaded()) return;
      const idx = state.items.findIndex(i => i.id === item.id);
      state.items.splice(idx + 1, 0, { ...item, id: uid(), paid: false, paidDate: '' });
      renderRows(); renderStats(); renderInstallments(); renderCalendar();
      const inputs = document.querySelectorAll('#' + id + '-rows .name-cell > input[data-field="name"]');
      if (inputs[idx + 1]) { inputs[idx + 1].focus(); inputs[idx + 1].select(); }
      persist();
      return;
    }
    if (checkbox) {
      const row = checkbox.closest('.row');
      const item = getItem(row.dataset.id);
      if (!item) return;
      item.paid = !item.paid;
      item.paidDate = item.paid ? todayStr() : '';
      renderRows();
      renderStats();
      renderInstallments();
      persist();
      return;
    }
    if (instToggle) {
      const row = instToggle.closest('.row');
      const item = getItem(row.dataset.id);
      if (!item) return;
      item.isInstallment = !item.isInstallment;
      renderRows();
      renderInstallments();
      persist();
      return;
    }
    if (delBtn) {
      const row = delBtn.closest('.row');
      state.items = state.items.filter(i => i.id !== row.dataset.id);
      renderRows();
      renderStats();
      renderInstallments();
      renderCalendar();
      persist();
    }
  });

  document.getElementById(id + '-add-expense-btn').addEventListener('click', () => {
    if (!ensureLoaded()) return;
    state.items.push({ id: uid(), name: '', amount: 0, due: '', dueDate: '', paid: false, paidDate: '', isInstallment: false, instPaid: 0, instTotal: null });
    renderRows();
    renderStats();
    renderInstallments();
    renderCalendar();
    const inputs = document.querySelectorAll('#' + id + '-rows .name-cell input');
    if (inputs.length) inputs[inputs.length - 1].focus();
    persist();
  });

  document.getElementById(id + '-month-select').addEventListener('change', async (e) => {
    state.currentMonth = e.target.value;
    await switchToMonth(state.currentMonth);
  });

  document.getElementById(id + '-new-month-btn').addEventListener('click', async () => {
    const label = prompt('New month (e.g. 2026-08 for August 2026):', nextMonthKey(state.currentMonth));
    if (!label) return;
    const key = label.trim();
    if (!/^\d{4}-\d{2}$/.test(key)) { alert('Please use YYYY-MM format, e.g. 2026-08'); return; }
    if (!state.monthsTrusted) {
      // Never overwrite the saved months list from an unconfirmed/offline view.
      const r = await loadMonthsList();
      if (r.ok && r.months && r.months.length) { state.months = r.months; state.monthsTrusted = true; }
      else if (!(r.ok && confirm('No saved months were found on your sheet. Only continue if this is a brand-new sheet.'))) {
        alert('Could not confirm your saved months. Tap Sync and try again.'); return;
      } else { state.monthsTrusted = true; }
    }
    if (!state.months.includes(key)) {
      state.months.push(key);
      state.months.sort();
      await saveMonthsList();
    }
    state.currentMonth = key;
    renderMonthSelect();
    await switchToMonth(key, true);
  });

  document.getElementById(id + '-dup-btn').addEventListener('click', async () => {
    if (state.loadFailed) { alert('Could not load this month, so copying is paused. Tap Sync to retry.'); return; }
    const idx = state.months.indexOf(state.currentMonth);
    const prevKey = idx > 0 ? state.months[idx - 1] : null;
    if (!prevKey) { alert('No earlier month to copy from.'); return; }
    const prevItems = await loadMonth(prevKey);
    if (!prevItems || !prevItems.length) { alert('That month has no items to copy.'); return; }
    if (state.loaded && state.items.length && !confirm('Replace this month\u2019s ' + state.items.length + ' items with a copy of the previous month?')) return;
    state.loaded = true;
    state.items = prevItems.map(it => ({ ...it, id: uid(), paid: false, paidDate: '', dueDate: it.dueDate ? shiftToMonth(it.dueDate, state.currentMonth) : '' }));
    state.selectedMoveId = null;
    renderRows();
    renderStats();
    renderInstallments();
    renderCalendar();
    persist();
  });

  // ---- Sync: re-pull the months list + current month fresh from the sheet ----
  const syncBtn = document.getElementById(id + '-sync-btn');
  syncBtn.addEventListener('click', async () => {
    if (syncBtn.classList.contains('spinning')) return;
    syncBtn.classList.add('spinning');
    const note = document.getElementById(id + '-save-note');
    const prevNote = note.textContent;
    note.textContent = 'Syncing…';
    try {
      const { months: freshMonths, ok } = await loadMonthsList();
      if (ok && freshMonths && freshMonths.length) {
        state.months = freshMonths;
        state.monthsTrusted = true;
        if (!state.months.includes(state.currentMonth)) {
          state.currentMonth = state.months[state.months.length - 1];
        }
        renderMonthSelect();
        await switchToMonth(state.currentMonth);
        note.textContent = 'Synced just now';
        setTimeout(() => { note.textContent = prevNote; }, 1800);
      } else {
        note.textContent = 'Sync failed — check your connection';
        setTimeout(() => { note.textContent = prevNote; }, 2500);
      }
    } catch (e) {
      note.textContent = 'Sync failed — check your connection';
      setTimeout(() => { note.textContent = prevNote; }, 2500);
    } finally {
      syncBtn.classList.remove('spinning');
    }
  });

  // ---- Delete month: two-step confirm (Continue, then type the month name) ----
  const deleteModal = document.getElementById(id + '-delete-modal');
  const step1 = document.getElementById(id + '-delete-step1');
  const step2 = document.getElementById(id + '-delete-step2');
  const confirmInput = document.getElementById(id + '-delete-confirm-input');
  const confirmBtn = document.getElementById(id + '-delete-confirm-btn');
  const confirmLabelEl = document.getElementById(id + '-delete-confirm-label');
  const deleteErrorEl = document.getElementById(id + '-delete-error');

  function openDeleteModal() {
    const label = monthLabel(state.currentMonth);
    document.getElementById(id + '-delete-step1-body').textContent =
      `This will permanently remove ${label} (${state.items.length} item${state.items.length === 1 ? '' : 's'}) for ${kind === 'personal' ? 'Personal' : 'Shared'}. This can't be undone.`;
    confirmLabelEl.textContent = label;
    confirmInput.value = '';
    deleteErrorEl.textContent = '';
    confirmBtn.disabled = true;
    step1.style.display = '';
    step2.style.display = 'none';
    deleteModal.classList.add('open');
  }
  function closeDeleteModal() { deleteModal.classList.remove('open'); }

  document.getElementById(id + '-delete-month-btn').addEventListener('click', () => {
    if (state.months.length <= 1) { alert('You need at least one month — add another before deleting this one.'); return; }
    openDeleteModal();
  });
  document.getElementById(id + '-delete-cancel-1').addEventListener('click', closeDeleteModal);
  document.getElementById(id + '-delete-cancel-2').addEventListener('click', closeDeleteModal);
  deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) closeDeleteModal(); });

  document.getElementById(id + '-delete-continue').addEventListener('click', () => {
    step1.style.display = 'none';
    step2.style.display = '';
    confirmInput.focus();
  });

  confirmInput.addEventListener('input', () => {
    const expected = monthLabel(state.currentMonth);
    confirmBtn.disabled = confirmInput.value.trim() !== expected;
    deleteErrorEl.textContent = '';
  });

  confirmBtn.addEventListener('click', async () => {
    const expected = monthLabel(state.currentMonth);
    if (confirmInput.value.trim() !== expected) {
      deleteErrorEl.textContent = 'That doesn\u2019t match. Please type it exactly.';
      return;
    }
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Deleting…';
    const keyToDelete = state.currentMonth;
    try {
      // Clear the month's data on the sheet (existing API only supports get/set,
      // so "delete" means wiping this key's contents to an empty list).
      await saveMonth(keyToDelete, []);
      state.months = state.months.filter(m => m !== keyToDelete);
      await saveMonthsList();
      state.currentMonth = state.months[state.months.length - 1];
      renderMonthSelect();
      await switchToMonth(state.currentMonth);
      closeDeleteModal();
    } catch (e) {
      deleteErrorEl.textContent = 'Could not delete — check your connection and try again.';
    } finally {
      confirmBtn.textContent = 'Delete month';
      confirmBtn.disabled = false;
    }
  });

  function nextMonthKey(key) {
    const [y, m] = key.split('-').map(Number);
    const d = new Date(y, m, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  async function switchToMonth(key, isNew) {
    state.loaded = false; // lock edits while loading so old rows can never be saved under the new month
    const { ok, items } = await fetchMonth(key);
    if (key !== state.currentMonth) return; // user already moved on
    state.loadFailed = !ok;
    state.loaded = !!items || (!!isNew && ok);
    let data = items;
    if (!data) {
      // Seed rows are display-only; never auto-saved.
      data = (key === SEEDS[kind].month && !isNew && ok) ? SEEDS[kind].items.map(it => ({ ...it, id: uid() })) : [];
    }
    state.items = data.map(it => it.dueDate ? { ...it, dueDate: shiftToMonth(it.dueDate, key) } : it);
    state.selectedMoveId = null;
    renderRows();
    renderStats();
    renderInstallments();
    renderCalendar();
    if (!state.loaded) {
      document.getElementById(id + '-save-note').textContent = ok
        ? 'No saved data found for this month — editing paused. Tap Sync to retry.'
        : 'Could not load this month — editing paused. Tap Sync to retry.';
    }
  }

  async function init() {
    const { months: storedMonths, ok } = await loadMonthsList();

    if (storedMonths && storedMonths.length) {
      // Got a real, non-empty list back from the server — trust it fully.
      state.months = storedMonths;
      state.monthsTrusted = true;
      if (!state.months.includes(SEEDS[kind].month)) {
        state.months.push(SEEDS[kind].month);
        state.months.sort();
        await saveMonthsList();
      }
    } else {
      // Either the fetch failed outright, or it "succeeded" but came back empty.
      // We can't fully trust an empty response on a cold start (Apps Script / Sheets
      // reads can return before the sheet is done indexing), so we NEVER write
      // anything back to the server from here — only an explicit "+ Month" click
      // is allowed to modify the saved months list. This guarantees a bad or
      // slow read can make the UI look wrong for a moment, but can never
      // permanently erase real data on the server.
      state.months = [SEEDS[kind].month];
      if (!ok) {
        document.getElementById(id + '-save-note').textContent =
          'Could not reach your sheet — showing offline view. Reload once you\u2019re back online.';
      }
    }

    state.currentMonth = state.months[state.months.length - 1];
    renderMonthSelect();
    await switchToMonth(state.currentMonth);
  }

  init();
}

const WISHLIST_KEY = 'wishlist:items';
function makeWishlist() {
  const root = document.getElementById('tab-wishlist');

        <div class="wl-seg" id="wl-in-type"><button type="button" data-v="need" class="on">Need</button><button type="button" data-v="want">Want</button></div>

    <div class="side-col">
      <div class="side-card"><p class="side-card-title">Buy next</p><div id="wl-next"></div><p class="wl-hint">Top 3 by priority &mdash; Needs come before Wants when tied.</p></div>
      <div class="side-card"><p class="side-card-title">By priority</p><div id="wl-prio-bars"></div></div>
    </div>
  </div>`;

  const PRIO = { high: 0, med: 1, low: 2 };
  const PRIO_LABEL = { high: 'High', med: 'Med', low: 'Low' };
  const state = { items: [], loaded: false, filter: 'all', newType: 'need', newPrio: 'med' };
  const $ = (s) => root.querySelector(s);
  const note = $('#wl-save-note');
  const peso = (n) => '₱' + Number(n || 0).toLocaleString('en-PH', { maximumFractionDigits: 2 });
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const uid = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const today = () => new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const sortItems = (arr) => arr.slice().sort((a, b) =>
    (a.bought - b.bought) || (PRIO[a.prio] - PRIO[b.prio]) || (a.created - b.created));

  // ---- load / save (never saves unless a load was confirmed) ----
  async function load() {
    note.textContent = 'Loading…';
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const res = await storage.get(WISHLIST_KEY);
        const arr = (res && res.value) ? JSON.parse(res.value) : [];
        state.items = Array.isArray(arr) ? arr.map(it => ({
          id: it.id || uid(), name: it.name || '', price: Number(it.price) || 0,
          type: it.type === 'want' ? 'want' : 'need', prio: PRIO[it.prio] !== undefined ? it.prio : 'med',
          note: it.note || '', bought: !!it.bought, boughtDate: it.boughtDate || '', created: it.created || 0
        })) : [];
        state.loaded = true;
        note.textContent = 'Saved to your sheet';
        render();
        return;
      } catch (e) {
        if (attempt < 3) await new Promise(r => setTimeout(r, 500 * attempt));
      }
    }
    state.loaded = false;
    note.textContent = 'Could not load wishlist — editing paused. Tap Sync to retry.';
    render();
  }

  let saving = false, again = false, flashT = null;
  async function persist() {
    if (!state.loaded) { note.textContent = 'Not saved — wishlist has not loaded. Tap Sync.'; return; }
    if (saving) { again = true; return; }
    saving = true;
    try {
      do {
        again = false;
        try {
          await storage.set(WISHLIST_KEY, JSON.stringify(state.items));
          note.textContent = 'Saved just now';
          clearTimeout(flashT); flashT = setTimeout(() => { note.textContent = 'Saved to your sheet'; }, 1800);
        } catch (e) { note.textContent = 'Could not save — check connection'; }
      } while (again);
    } finally { saving = false; }
  }
  let debounceT = null;
  const persistSoon = () => { clearTimeout(debounceT); debounceT = setTimeout(persist, 600); };
  const canEdit = () => {
    if (state.loaded) return true;
    alert('Your wishlist has not loaded from the sheet yet, so editing is paused to protect your data. Tap Sync to retry.');
    return false;
  };
  const getItem = (id) => state.items.find(i => i.id === id);

  // ---- render ----
  function renderStats() {
    const open = state.items.filter(i => !i.bought);
    const needs = open.filter(i => i.type === 'need'), wants = open.filter(i => i.type === 'want');
    const sum = (a) => a.reduce((s, i) => s + i.price, 0);
    const boughtSum = sum(state.items.filter(i => i.bought)), all = sum(state.items);
    const highNeeds = needs.filter(i => i.prio === 'high').length;
    $('#wl-stat-need').textContent = peso(sum(needs));
    $('#wl-stat-need-sub').textContent = needs.length + (needs.length === 1 ? ' item' : ' items') + (highNeeds ? ' · ' + highNeeds + ' high priority' : '');
    $('#wl-stat-want').textContent = peso(sum(wants));
    $('#wl-stat-want-sub').textContent = wants.length + (wants.length === 1 ? ' item' : ' items');
    $('#wl-stat-bought').textContent = peso(boughtSum);
    $('#wl-progress').style.width = (all ? Math.round(boughtSum / all * 100) : 0) + '%';
  }

  function itemHTML(it) {
    return `<div class="wl-item${it.bought ? ' done' : ''}" data-id="${it.id}">
      <button class="wl-check${it.bought ? ' on' : ''}" data-act="bought" title="${it.bought ? 'Mark as not bought' : 'Mark as bought'}" aria-label="Bought"></button>
      <div class="wl-main">
        <div class="wl-name-row"><input class="wl-name" data-field="name" value="${esc(it.name)}" aria-label="Item name" /></div>
        <div class="wl-meta">
          <button class="wl-pill ${it.prio}" data-act="prio" title="Tap to change priority">${PRIO_LABEL[it.prio]}</button>
          <button class="wl-swap" data-act="swap" title="Move to ${it.type === 'need' ? 'Wants' : 'Needs'}">&#8644; ${it.type === 'need' ? 'Want' : 'Need'}</button>
          ${it.bought && it.boughtDate ? `<span class="wl-bought-on">Bought ${esc(it.boughtDate)}</span>` : ''}
          <input class="wl-note" data-field="note" value="${esc(it.note)}" placeholder="+ note" aria-label="Note" />
        </div>
      </div>
      <div class="wl-price"><span>&#8369;</span><input data-field="price" inputmode="decimal" value="${it.price ? fmtMoney(it.price) : ''}" placeholder="0.00" autocomplete="off" aria-label="Price" /></div>
      <button class="wl-del" data-act="del" title="Delete" aria-label="Delete">&times;</button>
    </div>`;
  }

  function groupHTML(type, items, title, color, emptyMsg) {
    const left = items.filter(i => !i.bought).reduce((s, i) => s + i.price, 0);
    return `<div class="wl-group-title"><b style="color:${color}">${title}</b><span class="tot">${peso(left)} left</span></div>
      <div class="wl-list ${type}">${items.length ? sortItems(items).map(itemHTML).join('') : `<div class="wl-empty">${emptyMsg}</div>`}</div>`;
  }

  function renderGroups() {
    const f = state.filter, el = $('#wl-groups');
    const needs = state.items.filter(i => i.type === 'need'), wants = state.items.filter(i => i.type === 'want');
    if (f === 'bought') {
      const b = state.items.filter(i => i.bought);
      el.innerHTML = `<div class="wl-group-title"><b style="color:var(--teal)">Bought</b><span class="tot">${peso(b.reduce((s,i)=>s+i.price,0))} total</span></div>
        <div class="wl-list">${b.length ? sortItems(b).map(itemHTML).join('') : '<div class="wl-empty">Nothing bought yet.</div>'}</div>`;
      return;
    }
    let html = '';
    if (f !== 'want') html += groupHTML('need', needs, 'Needs', 'var(--red)', 'No needs yet — add one above.');
    if (f !== 'need') html += groupHTML('want', wants, 'Wants', 'var(--violet)', 'No wants yet — add one above.');
    el.innerHTML = html;
  }

  function renderSide() {
    const open = state.items.filter(i => !i.bought);
    const top = open.slice().sort((a, b) => (PRIO[a.prio] - PRIO[b.prio]) || ((a.type === 'need' ? 0 : 1) - (b.type === 'need' ? 0 : 1)) || (a.created - b.created)).slice(0, 3);
    $('#wl-next').innerHTML = top.length ? top.map((it, i) =>
      `<div class="wl-next"><span><span class="num">0${i + 1}</span>${esc(it.name || 'Untitled')}</span><span class="pr">${peso(it.price)}</span></div>`).join('')
      : '<p class="inst-empty">Nothing on the list yet.</p>';
    const total = open.reduce((s, i) => s + i.price, 0);
    const colors = { high: 'var(--gold)', med: 'var(--text-dim)', low: 'var(--text-faint)' };
    $('#wl-prio-bars').innerHTML = ['high', 'med', 'low'].map(p => {
      const g = open.filter(i => i.prio === p), s = g.reduce((a, i) => a + i.price, 0);
      return `<div class="wl-bar-row"><div class="wl-bar-label"><span>${PRIO_LABEL[p]} &middot; ${g.length}</span><span>${peso(s)}</span></div>
        <div class="wl-bar"><i style="width:${total ? Math.round(s / total * 100) : 0}%;background:${colors[p]}"></i></div></div>`;
    }).join('');
  }

  function render() { renderStats(); renderGroups(); renderSide(); }

  // ---- add form ----
  function setSeg(sel, v) { root.querySelectorAll(sel + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
  $('#wl-in-type').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.newType = b.dataset.v; setSeg('#wl-in-type', b.dataset.v); });
  $('#wl-in-prio').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.newPrio = b.dataset.v; setSeg('#wl-in-prio', b.dataset.v); });
  $('#wl-in-price').addEventListener('input', e => liveMoney(e.target));
  $('#wl-add').addEventListener('submit', e => {
    e.preventDefault();
    const err = $('#wl-add-err');
    const name = $('#wl-in-name').value.trim();
    const price = parseFloat($('#wl-in-price').value.replace(/[^0-9.]/g, '')) || 0;
    if (!name) { err.textContent = 'Give it a name first.'; err.style.display = 'block'; $('#wl-in-name').focus(); return; }
    err.style.display = 'none';
    if (!canEdit()) return;
    state.items.push({ id: uid(), name, price, type: state.newType, prio: state.newPrio, note: '', bought: false, boughtDate: '', created: Date.now() });
    $('#wl-in-name').value = ''; $('#wl-in-price').value = '';
    if (state.filter === 'bought' || (state.filter !== 'all' && state.filter !== state.newType)) { state.filter = 'all'; syncFilterBtns(); }
    render(); persist();
    $('#wl-in-name').focus();
  });

  // ---- list interactions ----
  const groups = $('#wl-groups');
  groups.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const it = getItem(b.closest('.wl-item').dataset.id); if (!it || !canEdit()) return;
    const act = b.dataset.act;
    if (act === 'bought') { it.bought = !it.bought; it.boughtDate = it.bought ? today() : ''; }
    else if (act === 'prio') { it.prio = { high: 'med', med: 'low', low: 'high' }[it.prio]; }
    else if (act === 'swap') { it.type = it.type === 'need' ? 'want' : 'need'; }
    else if (act === 'del') {
      if (!confirm('Delete "' + (it.name || 'this item') + '"?')) return;
      state.items = state.items.filter(x => x !== it);
    }
    render(); persist();
  });
  groups.addEventListener('input', e => {
    const f = e.target.dataset.field; if (!f) return;
    const it = getItem(e.target.closest('.wl-item').dataset.id); if (!it) return;
    if (!state.loaded) { e.target.value = it[f] || ''; canEdit(); return; }
    if (f === 'price') it.price = liveMoney(e.target);
    else it[f] = e.target.value;
    renderStats(); renderSide(); persistSoon();
  });
  // re-sort / tidy once the user leaves a field
  groups.addEventListener('change', e => { if (e.target.dataset.field) { clearTimeout(debounceT); persist(); renderGroups(); } });
  groups.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.field) e.target.blur(); });

  // ---- filter + sync ----
  function syncFilterBtns() { root.querySelectorAll('#wl-filter button').forEach(b => b.classList.toggle('on', b.dataset.f === state.filter)); }
  $('#wl-filter').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.filter = b.dataset.f; syncFilterBtns(); renderGroups(); });
  $('#wl-sync-btn').addEventListener('click', async () => {
    const btn = $('#wl-sync-btn'); btn.classList.add('spinning');
    clearTimeout(debounceT);
    if (state.loaded) await persist();
    await load();
    btn.classList.remove('spinning');
  });

  render();
  load();
}

// ===== Shrink big totals so they fit their tile (phones) =====
function fitStatValues() {
  document.querySelectorAll('.stat-value').forEach(el => {
    el.style.removeProperty('font-size');
    if (!el.offsetParent || el.scrollWidth <= el.clientWidth) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && fs > 11) { fs -= 0.5; el.style.setProperty('font-size', fs + 'px', 'important'); }
  });
}
new MutationObserver(() => requestAnimationFrame(fitStatValues)).observe(document.body, { subtree: true, characterData: true, childList: true });
window.addEventListener('resize', fitStatValues);
if (document.fonts) { document.fonts.ready.then(fitStatValues); document.fonts.addEventListener('loadingdone', fitStatValues); }
document.addEventListener('click', e => { if (e.target.closest('.tab-btn')) requestAnimationFrame(fitStatValues); });
// ===== Money boxes: "12,345.67" — commas while typing, max 2 decimals =====
function fmtMoney(n) {
  return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Re-formats the box in place (keeping the cursor where it was) and returns the number.
function liveMoney(input) {
  const old = input.value;
  const caret = input.selectionStart == null ? old.length : input.selectionStart;
  const keepBefore = old.slice(0, caret).replace(/[^0-9.]/g, '').length;
  let raw = old.replace(/[^0-9.]/g, '');
  const dot = raw.indexOf('.');
  if (dot !== -1) raw = raw.slice(0, dot + 1) + raw.slice(dot + 1).replace(/\./g, '').slice(0, 2);
  let [intPart, dec] = raw.split('.');
  intPart = (intPart || '').replace(/^0+(?=\d)/, '');
  const intOut = intPart ? intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : (dec !== undefined ? '0' : '');
  const out = intOut + (dec !== undefined ? '.' + dec : '');
  if (out !== old) {
    input.value = out;
    let seen = 0, pos = 0;
    while (pos < out.length && seen < keepBefore) { if (/[0-9.]/.test(out[pos])) seen++; pos++; }
    try { input.setSelectionRange(pos, pos); } catch (e) {}
  }
  return parseFloat(raw) || 0;
}


// ===== Theme sound effects (Kingdom Hearts + Final Fantasy only) =====
(function khSounds() {
  const KEY = 'kh-sound-pink';
  let enabled = true; try { enabled = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
  const pools = {};
  function pool(name) {
    if (!pools[name]) pools[name] = [0, 1, 2].map(() => { const a = new Audio('sounds/' + name + '.mp3'); a.preload = 'auto'; a.volume = 0.6; return a; });
    return pools[name];
  }
  // which file each theme uses; a theme without a 'save' sound uses its 'select' sound for confirmations too
  const SOUNDS = { kh: { select: 'kh-select', save: 'kh-save' }, ff: { select: 'ff-select' }, pokopia: { select: 'pokopia-select' }, zelda: { select: 'zelda-select', save: 'zelda-save' } };
  const themeSounds = () => SOUNDS[document.documentElement.dataset.theme];
  const active = () => !!themeSounds() && enabled;
  let last = 0;
  function play(name) {
    if (!active()) return;
    const now = Date.now(); if (now - last < 60) return; last = now;      // ignore double-fires from one tap
    const set = themeSounds(); const p = pool(set[name] || set.select); const a = p.find(x => x.paused || x.ended) || p[0];
    try { a.currentTime = 0; const r = a.play(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  }
  window.khPlay = play;
  // warm up once the theme is KH, so the first tap isn't silent
  const warm = () => { const set = themeSounds(); if (set) Object.values(set).forEach(pool); };
  warm(); new MutationObserver(warm).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // "save" = confirming something
  const SAVE = '.add-row button, .wl-add-btn, [data-act="dup"], .row-menu [data-field="delete"], [id$="-new-month-btn"], [id$="-dup-btn"], [id$="-delete-confirm-btn"], #cfg-connect';
  // "select" = ordinary clicks
  const SELECT = '.tab-btn, .more-btn, .menu-item, .inst-toggle, .wl-pill, .wl-swap, .wl-filter button, .wl-seg button, .cal-day.has-due, .icon-btn, .btn-ghost, .wl-del, button';
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('.sound-toggle')) return;          // the toggle handles its own sound
    const box = t.closest('.checkbox, .wl-check');
    if (box) { play(box.classList.contains('checked') || box.classList.contains('on') ? 'select' : 'save'); return; }  // ticking = save, unticking = select
    if (t.closest(SAVE)) { play('save'); return; }
    if (t.closest('.row-menu .due-item')) return;
    if (t.closest(SELECT)) play('select');
  }, true);
  document.addEventListener('change', (e) => {
    if (e.target.matches('input[data-field="dueDate"]')) play('save');
    else if (e.target.matches('select')) play('select');
  }, true);

  const btn = document.getElementById('sound-toggle');
  const paint = () => { btn.classList.toggle('muted', !enabled); btn.setAttribute('aria-pressed', String(enabled));
    btn.title = btn.ariaLabel = enabled ? 'Sound on' : 'Sound off'; btn.setAttribute('aria-label', btn.title); };
  paint();
  btn.addEventListener('click', () => { enabled = !enabled; try { localStorage.setItem(KEY, enabled ? 'on' : 'off'); } catch (e) {} paint(); if (enabled) { last = 0; play('select'); } });
})();

// Her sheet's web app link (not secret on its own: the passphrase is still required)
const PREFILL_URL = 'https://script.google.com/macros/s/AKfycbwGxudaj-sv5WLWtrS4SucmWV0K-Kv2wGr4opgKYkmjR-DRV698b9crxE2WXIFrqzhi/exec';
(function boot() {
  const urlInput = document.getElementById('cfg-url');
  if (!urlInput.value) urlInput.value = PREFILL_URL;
  const cfg = getConfig();
  if (cfg && cfg.url && cfg.pass) {
    document.getElementById('cfg-url').value = cfg.url;
    document.getElementById('setup-gate').style.display = 'none';
    document.getElementById('app-content').classList.add('ready');
    startApp();
  }
})();

// ===== Pokopia: logo-style coloured letters on page titles =====
(function pokoLetters() {
  const isPoko = () => document.documentElement.dataset.theme === 'pokopia';
  function paint(h) {
    const text = h.textContent;
    if (isPoko()) {
      if (h.querySelector('.pk-l') && h.dataset.pkText === text) return;
      h.dataset.pkText = text;
      const word = document.createElement('span'); word.className = 'pk-word';
      for (const ch of text) {
        if (ch === ' ') { word.appendChild(document.createTextNode(' ')); continue; }
        const s = document.createElement('span'); s.className = 'pk-l'; s.textContent = ch; word.appendChild(s);
      }
      h.innerHTML = ''; h.appendChild(word);
    } else if (h.querySelector('.pk-l')) { h.textContent = text; }
  }
  const all = () => document.querySelectorAll('#app-content h1').forEach(paint);
  const app = document.getElementById('app-content');
  const mo = new MutationObserver(() => { mo.disconnect(); all(); watch(); });
  function watch() {
    mo.observe(app, { childList: true, characterData: true, subtree: true });   // titles changing or created later
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }
  all(); watch();
})();
</script>
