<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Expense Ledger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M14 26 L13 9 L25 18 Q32 16 39 18 L51 9 L50 26 Q55 33 53 41 Q50 54 32 54 Q14 54 11 41 Q9 33 14 26Z%22 fill=%22%23FFE3EC%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M17 14 L18 22 L23 19Z M47 14 L46 22 L41 19Z%22 fill=%22%23F7B6C8%22/%3E%3Ccircle cx=%2224%22 cy=%2235%22 r=%222.6%22 fill=%22%234B2D37%22/%3E%3Ccircle cx=%2240%22 cy=%2235%22 r=%222.6%22 fill=%22%234B2D37%22/%3E%3Cpath d=%22M30 40 L34 40 L32 42.5Z%22 fill=%22%23E5789A%22/%3E%3Cpath d=%22M32 42.5 Q30 46 27 45 M32 42.5 Q34 46 37 45%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%221.8%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M8 38 L19 39 M8 43 L19 42 M56 38 L45 39 M56 43 L45 42%22 stroke=%22%234B2D37%22 stroke-width=%221.5%22 stroke-linecap=%22round%22/%3E%3Cellipse cx=%2219%22 cy=%2241%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22 opacity=%22.8%22/%3E%3Cellipse cx=%2245%22 cy=%2241%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22 opacity=%22.8%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6F8;
    --panel: #FFFFFF;
    --panel-2: #FFF0F4;
    --line: #F5CFDA;
    --line-soft: #FBE4EB;
    --text: #4B2D37;
    --text-dim: #8E6572;
    --text-faint: #BE96A3;
    --gold: #E5789A;
    --gold-dim: #FDE3EB;
    --teal: #4FB08F;
    --teal-dim: #DDF3EA;
    --red: #D9577A;
    --red-dim: #FCE0E8;
    --violet: #9A7FDB;
    --violet-dim: #EEE7FB;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    padding: 40px 24px 80px;
    padding-left: max(24px, env(safe-area-inset-left));
    padding-right: max(24px, env(safe-area-inset-right));
    padding-bottom: max(80px, env(safe-area-inset-bottom) + 60px);
    overflow-x: hidden;
    min-width: 320px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    align-items: start;
  }
  .main-col { min-width: 0; }
  .side-col { display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 900px) {
    .dash-grid { grid-template-columns: 1fr; }
  }

  .side-card {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 16px;
  }
  .side-card-title {
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 12px;
  }

  .inst-empty { font-size: 12.5px; color: var(--text-faint); line-height: 1.5; }
  .inst-item { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .inst-item:last-child { border-bottom: none; padding-bottom: 0; }
  .inst-item-name { font-size: 13px; font-weight: 500; margin: 0 0 6px; }
  .inst-item-row { display: flex; justify-content: space-between; align-items: center; font-family: 'Nunito', sans-serif; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .inst-progress-track { height: 5px; background: var(--line-soft); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .inst-progress-fill { height: 100%; background: var(--violet); border-radius: 3px; }
  #tab-personal .inst-progress-fill { background: var(--gold); }
  .inst-remaining { font-family: 'Nunito', sans-serif; font-size: 11.5px; color: var(--text); }
  .inst-remaining span { color: var(--text-faint); }

  .cal-header { display: flex; justify-content: center; margin-bottom: 10px; }
  .cal-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; margin: 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { font-family: 'Nunito', sans-serif; font-size: 9px; color: var(--text-faint); text-align: center; padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 5px;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    cursor: default;
    position: relative;
  }
  .cal-day.has-due { cursor: pointer; background: var(--panel-2); color: var(--text); }
  .cal-day.has-due:hover { background: var(--line); }
  .cal-day.armed { outline: 1.5px solid var(--gold); background: var(--gold-dim); color: var(--text); }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--teal); margin-top: 2px; }
  #tab-shared .cal-dot { background: var(--violet); }
  .cal-hint { font-family: 'Nunito', sans-serif; font-size: 10.5px; color: var(--text-faint); margin: 10px 0 0; line-height: 1.5; }
  .cal-hint.armed-hint { color: var(--gold); }


  .tabs { display: flex; gap: 6px; margin-bottom: 20px; }
  .tab-btn {
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--text-dim); border-color: var(--text-faint); }
  .tab-btn.active { color: #FFFFFF; font-weight: 700; }
  .tab-btn.active[data-tab="personal"] { background: var(--gold); border-color: var(--gold); }
  .tab-btn.active[data-tab="shared"] { background: var(--violet); border-color: var(--violet); }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .eyebrow {
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  #tab-personal .eyebrow, .accent-gold { color: var(--gold); }
  #tab-shared .eyebrow, .accent-violet { color: var(--violet); }
  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .month-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .icon-btn {
    width: 34px; height: 34px;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .danger-hover:hover { border-color: var(--red-dim); background: var(--red-dim); color: var(--red); }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  button {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--text-faint); background: var(--panel-2); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--text-dim); }
  .btn-ghost:hover { background: var(--panel); border-color: var(--line); color: var(--text); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-label {
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 8px;
  }
  .stat-value {
    font-family: 'Fredoka', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0;
  }
  .stat-sub { font-family: 'Nunito', sans-serif; font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  .stat.remaining .stat-value.g { color: var(--gold); }
  .stat.remaining .stat-value.v { color: var(--violet); }
  .stat.paid .stat-value { color: var(--teal); }

  .progress-track {
    height: 6px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 3px;
    transition: width .3s ease;
  }

  .ledger {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    overflow: hidden;
  }
  .ledger-head {
    display: grid;
    grid-template-columns: 22px 1fr 110px 120px 110px 88px;
    gap: 10px;
    padding: 12px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-faint);
    border-bottom: 1px solid var(--line-soft);
  }
  .row {
    display: grid;
    grid-template-columns: 22px 1fr 110px 120px 110px 88px;
    gap: 10px;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line-soft);
  }
  .row:last-child { border-bottom: none; }
  .row.is-paid { background: rgba(79,203,175,0.045); }
  .row.dragging { opacity: 0.35; }
  .row.drag-over-top { box-shadow: inset 0 2px 0 var(--gold); }
  .row.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--gold); }

  .drag-handle {
    width: 20px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .drag-handle:hover { color: var(--text-dim); }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg { width: 13px; height: 13px; }

  .name-cell input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 5px 6px;
    border-radius: 5px;
  }
  .name-cell input:hover, .name-cell input:focus { background: var(--panel-2); outline: none; }
  .due-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    color: var(--text-faint);
    padding: 1px 6px 0;
  }
  .due-tag input[type="text"] {
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    width: 100%;
    padding: 2px 0;
    flex: 1;
    min-width: 0;
  }
  .due-tag input[type="text"]:hover, .due-tag input[type="text"]:focus { color: var(--text-dim); outline: none; }

  .date-picker-wrap {
    position: relative;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border-radius: 4px;
  }
  .date-picker-wrap:hover { background: var(--panel-2); }
  .date-picker-wrap svg {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 13px;
    height: 13px;
    color: var(--text-faint);
    pointer-events: none;
  }
  .date-picker-wrap.has-date svg { color: var(--teal); }
  #tab-personal .date-picker-wrap.has-date svg { color: var(--gold); }
  .date-picker-wrap input[type="date"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color-scheme: light;
  }

  .inst-toggle {
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    color: var(--text-faint);
    padding: 3px 6px 0;
    cursor: pointer;
    display: inline-block;
  }
  .inst-toggle:hover { color: var(--gold); }
  .inst-toggle.on { color: var(--violet); }
  #tab-personal .inst-toggle.on { color: var(--gold); }
  .inst-row-fields {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px 0;
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    color: var(--text-faint);
  }
  .inst-row-fields input {
    width: 40px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    padding: 2px 4px;
    border-radius: 4px;
    text-align: center;
  }
  .inst-row-fields input:focus { outline: none; border-color: var(--gold); }

  .amount-cell { display: flex; align-items: center; gap: 3px; }
  .amount-cell span { color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 13px; }
  .amount-cell input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    padding: 6px 7px;
    border-radius: 5px;
    text-align: right;
  }
  .amount-cell input:focus { outline: none; border-color: var(--gold); }

  .paid-cell { display: flex; align-items: center; gap: 8px; }
  .checkbox {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--line);
    background: var(--panel-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .12s;
  }
  .checkbox.checked { background: var(--teal); border-color: var(--teal); }
  .checkbox svg { width: 12px; height: 12px; display: none; }
  .checkbox.checked svg { display: block; }
  .paid-label {
    font-family: 'Nunito', sans-serif;
    font-size: 11.5px;
    color: var(--text-faint);
  }
  .row.is-paid .paid-label { color: var(--teal); }

  .date-cell {
    font-family: 'Nunito', sans-serif;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .date-cell input {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'Nunito', sans-serif;
    font-size: 11.5px;
    width: 100%;
    padding: 2px 0;
  }
  .date-cell input:hover, .date-cell input:focus { color: var(--text); outline: none; }
  .date-cell.empty input { color: var(--text-faint); }

  .del-btn {
    width: 26px; height: 26px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .del-btn:hover { background: var(--red-dim); color: var(--red); }
  .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .act-btn {
    width: 26px; height: 26px; border-radius: 5px; border: none; background: transparent;
    color: var(--text-faint); display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .act-btn:hover { background: rgba(79,203,175,0.14); color: var(--teal); }

  .add-row { padding: 12px 18px; display: flex; }
  .add-row button { width: 100%; border-style: dashed; color: var(--text-dim); }
  .add-row button:hover { color: var(--gold); border-color: var(--gold-dim); }
  #tab-shared .add-row button:hover { color: var(--violet); border-color: var(--violet-dim); }

  .footer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .footer-note {
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    color: var(--text-faint);
  }

  .panel-view { display: none; }
  .panel-view.active { display: block; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(75, 45, 55, 0.35);
    backdrop-filter: blur(2px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  .modal-title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 10px;
    color: var(--red);
  }
  .modal-body {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.55;
    margin: 0 0 16px;
  }
  .modal-body strong { color: var(--text); font-weight: 600; }
  .modal-input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 6px;
  }
  .modal-input:focus { outline: none; border-color: var(--red); }
  .modal-error { color: var(--red); font-size: 12px; min-height: 16px; margin: 8px 0 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn-danger {
    background: var(--red);
    border-color: var(--red);
    color: #2A1310;
    font-weight: 600;
  }
  .btn-danger:hover { background: #c85a41; border-color: #c85a41; }
  .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; background: var(--red); border-color: var(--red); }

  #setup-gate {
    max-width: 480px;
    margin: 80px auto;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 28px 26px;
  }
  #setup-gate h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    margin: 0 0 6px;
  }
  #setup-gate p { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; margin: 0 0 18px; }
  #setup-gate label {
    display: block;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 14px 0 6px;
  }
  #setup-gate input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
  }
  #setup-gate input:focus { outline: none; border-color: var(--gold); }
  #setup-error { color: var(--red); font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  #setup-gate .actions { display: flex; gap: 8px; margin-top: 20px; }
  #app-content { display: none; }
  #app-content.ready { display: block; }
  #reset-config {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    right: max(16px, env(safe-area-inset-right));
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    color: var(--text-faint);
    background: none; border: none; cursor: pointer;
    opacity: 0.5;
  }
  #reset-config:hover { opacity: 1; }


  /* ===== Tablet (iPad portrait, small laptops) ===== */
  @media (max-width: 900px) {
    body { padding-top: 28px; }
    h1 { font-size: 26px; }
    .topbar { margin-bottom: 22px; }
  }

  /* ===== Phones (iPhone SE through iPhone Pro Max, small Android) ===== */
  @media (max-width: 640px) {
    body { padding: 20px 14px 80px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    h1 { font-size: 22px; }
    .eyebrow { font-size: 10px; }
    .tabs { margin-bottom: 16px; }
    .tab-btn { padding: 10px 14px; font-size: 12.5px; }

    .topbar { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 20px; }
    .month-controls { justify-content: space-between; }
    .month-controls select { flex: 1; min-width: 0; }

    .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 12px 14px; }
    .stat-value { font-size: 19px; }

    .ledger-head { display: none; }
    .row {
      grid-template-columns: 1fr;
      row-gap: 8px;
      padding: 14px 16px;
    }
    .amount-cell, .paid-cell, .date-cell { justify-content: space-between; }
    .amount-cell::before { content: 'Amount'; color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 10px; margin-right: auto; }
    .date-cell::before { content: 'Paid on'; color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 10px; }
    .row-actions { justify-self: end; }

    .side-col { gap: 12px; }
    .cal-day { font-size: 12px; }

    #setup-gate { margin: 40px 16px; padding: 22px 18px; }

    /* Bigger touch targets so fingers can hit them reliably */
    .checkbox { width: 24px; height: 24px; }
    .del-btn, .act-btn { width: 34px; height: 34px; }
    .drag-handle { width: 28px; height: 34px; }
    .date-picker-wrap { width: 24px; height: 24px; }
    button, select { min-height: 40px; }
    .tab-btn { min-height: 40px; }

    /* iOS Safari zooms the whole page in when a focused input has font-size < 16px.
       Force real inputs the user types into up to 16px so focusing them doesn't zoom. */
    .name-cell input,
    .amount-cell input,
    .date-cell input,
    .due-tag input[type="text"],
    .inst-row-fields input,
    #setup-gate input,
    select {
      font-size: 16px;
    }
  }

  /* Very small phones (iPhone SE / mini widths) */
  @media (max-width: 380px) {
    .stats { grid-template-columns: 1fr; }
    .stat-value { font-size: 22px; }
  }

  /* ===== Wishlist tab ===== */
  .tab-btn.active[data-tab="wishlist"] { background: var(--teal); border-color: var(--teal); }
  #tab-wishlist .eyebrow { color: var(--teal); }
  .wl-filter { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 3px; align-items: center; }
  .wl-filter button { font-family: 'Nunito', sans-serif; font-size: 12px; padding: 6px 12px; border-radius: 6px; border: none; background: transparent; color: var(--text-dim); }
  .wl-filter button:hover { background: var(--panel-2); color: var(--text); }
  .wl-filter button.on { background: var(--panel-2); color: var(--text); }
  .wl-c-red { color: var(--red); } .wl-c-violet { color: var(--violet); } .wl-c-teal { color: var(--teal); }

  .wl-add { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 130px auto auto auto; gap: 10px; align-items: center; }
  .wl-field { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 14px; padding: 9px 11px; font-family: 'Nunito', sans-serif; width: 100%; min-width: 0; }
  .wl-field.mono { font-family: 'Nunito', sans-serif; text-align: right; }
  .wl-field::placeholder { color: var(--text-faint); }
  .wl-field:focus { outline: none; border-color: var(--teal); }
  .wl-seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
  .wl-seg button { font-family: 'Nunito', sans-serif; font-size: 11.5px; padding: 6px 10px; border-radius: 4px; border: none; background: transparent; color: var(--text-faint); white-space: nowrap; flex: 1; }
  .wl-seg button:hover { background: var(--line-soft); color: var(--text-dim); }
  .wl-seg button.on[data-v="need"] { background: var(--red-dim); color: var(--red); }
  .wl-seg button.on[data-v="want"] { background: var(--violet-dim); color: var(--violet); }
  .wl-seg button.on[data-v="high"] { background: var(--gold-dim); color: var(--gold); }
  .wl-seg button.on[data-v="med"] { background: var(--line); color: var(--text); }
  .wl-seg button.on[data-v="low"] { background: var(--line-soft); color: var(--text-dim); }
  .wl-add-btn { background: var(--teal); color: #FFFFFF; border: none; font-weight: 600; }
  .wl-add-btn:hover { background: #5fc19f; border: none; }
  .wl-add-err { grid-column: 1 / -1; color: var(--red); font-size: 12px; margin: -2px 0 0; display: none; }

  .wl-group-title { display: flex; align-items: baseline; justify-content: space-between; font-family: 'Nunito', sans-serif; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); margin: 0 4px 8px; }
  .wl-group-title b { font-weight: 600; }
  .wl-group-title .tot { color: var(--text-dim); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .wl-list { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; margin-bottom: 22px; }
  .wl-list.need { box-shadow: inset 3px 0 0 var(--red); }
  .wl-list.want { box-shadow: inset 3px 0 0 var(--violet); }
  .wl-empty { padding: 16px 18px; font-size: 13px; color: var(--text-faint); }
  .wl-item { display: grid; grid-template-columns: 22px 1fr 120px 34px; gap: 12px; align-items: center; padding: 10px 16px 10px 18px; border-bottom: 1px solid var(--line-soft); }
  .wl-item:last-child { border-bottom: none; }
  .wl-item.done { background: rgba(79,203,175,0.045); }
  .wl-check { width: 20px; height: 20px; padding: 0; border-radius: 5px; border: 1.5px solid var(--line); background: var(--panel-2); display: flex; align-items: center; justify-content: center; }
  .wl-check.on { background: var(--teal); border-color: var(--teal); }
  .wl-check.on::after { content: ''; width: 9px; height: 5px; border-left: 2px solid #FFFFFF; border-bottom: 2px solid #FFFFFF; transform: rotate(-45deg) translate(1px,-1px); }
  .wl-main { min-width: 0; }
  .wl-name-row { display: flex; align-items: center; gap: 6px; }
  .wl-name { flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 500; padding: 5px 6px; border-radius: 5px; }
  .wl-name:hover, .wl-name:focus { background: var(--panel-2); outline: none; }
  .wl-item.done .wl-name { text-decoration: line-through; color: var(--text-faint); }
  .wl-meta { display: flex; align-items: center; gap: 8px; padding: 2px 6px 0; flex-wrap: wrap; }
  .wl-pill { font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; border: 1px solid transparent; background: transparent; min-height: 0; line-height: 1.5; }
  .wl-pill.high { background: var(--gold-dim); color: var(--gold); }
  .wl-pill.med { background: var(--panel-2); color: var(--text-dim); border-color: var(--line); }
  .wl-pill.low { color: var(--text-faint); border-color: var(--line-soft); }
  .wl-pill:hover { filter: brightness(1.2); }
  .wl-swap { font-family: 'Nunito', sans-serif; font-size: 10px; color: var(--text-faint); background: none; border: none; padding: 2px 0; min-height: 0; }
  .wl-swap:hover { color: var(--text); background: none; border: none; }
  .wl-note { flex: 1; min-width: 120px; background: transparent; border: none; color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 12px; padding: 2px 0; }
  .wl-note:hover, .wl-note:focus { color: var(--text-dim); outline: none; }
  .wl-note::placeholder { color: var(--line); }
  .wl-item:hover .wl-note::placeholder { color: var(--text-faint); }
  .wl-bought-on { font-family: 'Nunito', sans-serif; font-size: 10.5px; color: var(--teal); }
  .wl-price { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
  .wl-price span { color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 13px; }
  .wl-price input { width: 96px; background: transparent; border: 1px solid transparent; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px; padding: 6px 7px; border-radius: 5px; text-align: right; }
  .wl-price input:hover { background: var(--panel-2); border-color: var(--line); }
  .wl-price input:focus { outline: none; background: var(--panel-2); border-color: var(--teal); }
  .wl-item.done .wl-price input { color: var(--text-faint); }
  .wl-del { width: 30px; height: 30px; padding: 0; border: none; background: transparent; color: var(--text-faint); font-size: 18px; line-height: 1; }
  .wl-del:hover { background: var(--red-dim); color: var(--red); border: none; }

  .wl-next { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .wl-next:last-of-type { border-bottom: none; }
  .wl-next .num { font-family: 'Nunito', sans-serif; color: var(--text-faint); margin-right: 8px; }
  .wl-next .pr { font-family: 'Nunito', sans-serif; color: var(--text-dim); white-space: nowrap; }
  .wl-bar-row { margin-bottom: 12px; }
  .wl-bar-row:last-child { margin-bottom: 0; }
  .wl-bar-label { display: flex; justify-content: space-between; font-family: 'Nunito', sans-serif; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .wl-bar { height: 5px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
  .wl-bar i { display: block; height: 100%; border-radius: 3px; transition: width .3s ease; }
  .wl-hint { font-family: 'Nunito', sans-serif; font-size: 10.5px; color: var(--text-faint); line-height: 1.5; margin: 12px 0 0; }

  @media (max-width: 760px) {
    .wl-add { grid-template-columns: 1fr 1fr; }
    .wl-add .wl-name-in, .wl-add .wl-add-btn { grid-column: 1 / -1; }
    .wl-add .wl-price-in { grid-column: 1 / -1; }
  }
  @media (max-width: 640px) {
    .wl-filter { justify-content: space-between; }
    .wl-filter button { flex: 1; min-height: 36px; }
    #tab-wishlist .stat:last-child { grid-column: 1 / -1; }
    .wl-item { grid-template-columns: 24px minmax(0,1fr) auto 34px; grid-template-areas: "chk name name del" "chk meta price del"; column-gap: 8px; row-gap: 2px; padding: 12px 10px 12px 14px; }
    .wl-main { display: contents; }
    .wl-check { grid-area: chk; align-self: start; margin-top: 6px; }
    .wl-name-row { grid-area: name; }
    .wl-meta { grid-area: meta; align-self: start; min-width: 0; }
    .wl-note { min-width: 0; flex-basis: 100%; }
    .wl-name-row { min-width: 0; }
    .wl-price { grid-area: price; align-self: start; }
    .wl-price input { width: 84px; padding: 4px 6px; }
    .wl-del { grid-area: del; align-self: start; }
    .wl-check { width: 24px; height: 24px; min-height: 0; }
    .wl-del { min-height: 0; width: 34px; height: 34px; }
    .wl-pill, .wl-swap { min-height: 0; }
    .wl-seg button { min-height: 36px; }
    .wl-field, .wl-name, .wl-price input, .wl-note { font-size: 16px; }
  }

  /* ===== Soft pink + cats theme ===== */
  body { font-weight: 500; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle at 12% 8%, #FFE3EC 0, transparent 38%), radial-gradient(circle at 90% 85%, #F3ECFF 0, transparent 40%); }
  #app-content, #setup-gate { position: relative; z-index: 1; }
  .stat, .side-card, .ledger, .wl-list, .wl-add, .modal-box, #setup-gate { border-radius: 18px; border-color: var(--line-soft); box-shadow: 0 6px 18px rgba(229,120,154,0.08); }
  .tab-btn { border-radius: 999px; text-transform: none; letter-spacing: .01em; font-size: 13.5px; font-weight: 700; }
  .tab-btn.active[data-tab="personal"] { box-shadow: 0 4px 12px rgba(229,120,154,.35); }
  .tab-btn.active[data-tab="shared"] { box-shadow: 0 4px 12px rgba(154,127,219,.35); }
  .tab-btn.active[data-tab="wishlist"] { box-shadow: 0 4px 12px rgba(79,176,143,.35); }
  button, select, .wl-field, .wl-seg, .wl-filter { border-radius: 12px; }
  .wl-seg button, .wl-filter button { border-radius: 9px; }
  .eyebrow, .stat-label, .side-card-title, .ledger-head, .wl-group-title { letter-spacing: .06em; font-weight: 800; }
  h1 { font-weight: 600; display: flex; align-items: center; gap: 10px; }
  h1::before { content: ''; width: 42px; height: 42px; flex-shrink: 0; background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M14 26 L13 9 L25 18 Q32 16 39 18 L51 9 L50 26 Q55 33 53 41 Q50 54 32 54 Q14 54 11 41 Q9 33 14 26Z%22 fill=%22%23FFFFFF%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M17 14 L18 22 L23 19Z M47 14 L46 22 L41 19Z%22 fill=%22%23F7B6C8%22/%3E%3Ccircle cx=%2224%22 cy=%2235%22 r=%222.6%22 fill=%22%234B2D37%22/%3E%3Ccircle cx=%2240%22 cy=%2235%22 r=%222.6%22 fill=%22%234B2D37%22/%3E%3Cpath d=%22M30 40 L34 40 L32 42.5Z%22 fill=%22%23E5789A%22/%3E%3Cpath d=%22M32 42.5 Q30 46 27 45 M32 42.5 Q34 46 37 45%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%221.8%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M8 38 L19 39 M8 43 L19 42 M56 38 L45 39 M56 43 L45 42%22 stroke=%22%234B2D37%22 stroke-width=%221.5%22 stroke-linecap=%22round%22/%3E%3Cellipse cx=%2219%22 cy=%2241%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22 opacity=%22.8%22/%3E%3Cellipse cx=%2245%22 cy=%2241%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22 opacity=%22.8%22/%3E%3C/svg%3E") center/contain no-repeat; }
  .side-card-title { display: flex; align-items: center; gap: 6px; }
  .side-card-title::before { content: ''; width: 14px; height: 14px; background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23F2A7BD%22%3E%3Cellipse cx=%2212%22 cy=%2216%22 rx=%225%22 ry=%224.2%22/%3E%3Ccircle cx=%226%22 cy=%2210%22 r=%222.2%22/%3E%3Ccircle cx=%2210%22 cy=%226.5%22 r=%222.2%22/%3E%3Ccircle cx=%2214%22 cy=%226.5%22 r=%222.2%22/%3E%3Ccircle cx=%2218%22 cy=%2210%22 r=%222.2%22/%3E%3C/svg%3E") center/contain no-repeat; }
  .ledger, .wl-list:first-of-type { overflow: visible; position: relative; }
  .main-col .ledger { margin-top: 30px; }
  .main-col .ledger::before { content: ''; position: absolute; top: -29px; right: 28px; width: 64px; height: 32px; background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 80 40%22%3E%3Cpath d=%22M18 40 L18 22 L16 6 L28 14 Q40 11 52 14 L64 6 L62 22 L62 40Z%22 fill=%22%23FFFFFF%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M20 11 L21 18 L26 15Z M60 11 L59 18 L54 15Z%22 fill=%22%23F7B6C8%22/%3E%3Cpath d=%22M28 27 Q31 24 34 27 M46 27 Q49 24 52 27%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M38 31 L42 31 L40 33Z%22 fill=%22%23E5789A%22/%3E%3Cellipse cx=%2224%22 cy=%2233%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22/%3E%3Cellipse cx=%2256%22 cy=%2233%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22/%3E%3Crect x=%2210%22 y=%2233%22 width=%2214%22 height=%2210%22 rx=%225%22 fill=%22%23FFFFFF%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22/%3E%3Crect x=%2256%22 y=%2233%22 width=%2214%22 height=%2210%22 rx=%225%22 fill=%22%23FFFFFF%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22/%3E%3C/svg%3E") center bottom/contain no-repeat; pointer-events: none; }
  .ledger > :first-child { border-radius: 18px 18px 0 0; }
  .add-row button { border-radius: 0 0 18px 18px; }
  [id$="-rows"]:empty::before { content: 'Nothing here yet \2014  add your first expense below'; display: block; padding: 78px 18px 22px; text-align: center; color: var(--text-faint); font-size: 13.5px;
    background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 96 48%22%3E%3Cpath d=%22M14 44 Q8 26 28 22 L30 10 L38 19 Q46 17 52 20 L60 12 L60 24 Q84 22 84 40 Q84 46 76 46 L20 46 Q14 46 14 44Z%22 fill=%22%23FFFFFF%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M84 40 Q94 38 90 30%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M34 32 Q37 34 40 32 M48 32 Q51 34 54 32%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3Cellipse cx=%2232%22 cy=%2237%22 rx=%223%22 ry=%221.7%22 fill=%22%23F7B6C8%22/%3E%3Cellipse cx=%2256%22 cy=%2237%22 rx=%223%22 ry=%221.7%22 fill=%22%23F7B6C8%22/%3E%3Ctext x=%2266%22 y=%2214%22 font-family=%22sans-serif%22 font-size=%229%22 font-weight=%22700%22 fill=%22%23E5789A%22%3Ez%3C/text%3E%3Ctext x=%2273%22 y=%228%22 font-family=%22sans-serif%22 font-size=%227%22 font-weight=%22700%22 fill=%22%23F2A7BD%22%3Ez%3C/text%3E%3C/svg%3E") center 18px/96px auto no-repeat; }
  .wl-empty { padding: 70px 18px 20px; text-align: center; background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 96 48%22%3E%3Cpath d=%22M14 44 Q8 26 28 22 L30 10 L38 19 Q46 17 52 20 L60 12 L60 24 Q84 22 84 40 Q84 46 76 46 L20 46 Q14 46 14 44Z%22 fill=%22%23FFFFFF%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M84 40 Q94 38 90 30%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M34 32 Q37 34 40 32 M48 32 Q51 34 54 32%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3Cellipse cx=%2232%22 cy=%2237%22 rx=%223%22 ry=%221.7%22 fill=%22%23F7B6C8%22/%3E%3Cellipse cx=%2256%22 cy=%2237%22 rx=%223%22 ry=%221.7%22 fill=%22%23F7B6C8%22/%3E%3Ctext x=%2266%22 y=%2214%22 font-family=%22sans-serif%22 font-size=%229%22 font-weight=%22700%22 fill=%22%23E5789A%22%3Ez%3C/text%3E%3Ctext x=%2273%22 y=%228%22 font-family=%22sans-serif%22 font-size=%227%22 font-weight=%22700%22 fill=%22%23F2A7BD%22%3Ez%3C/text%3E%3C/svg%3E") center 14px/84px auto no-repeat; }
  .inst-empty { color: var(--text-faint); }
  .wl-pill.high { background: var(--gold-dim); color: var(--gold); }
  .progress-track, .wl-bar, .inst-progress-track { border-radius: 99px; }
  .progress-fill, .wl-bar i, .inst-progress-fill { border-radius: 99px; }
  .tab-btn.active[data-tab="wishlist"] { background: var(--gold); border-color: var(--gold); box-shadow: 0 4px 12px rgba(229,120,154,.35); }
  #tab-wishlist .eyebrow { color: var(--gold); }
  .wl-add-btn { background: var(--gold); }
  .wl-add-btn:hover { background: #d9668a; }
  .wl-field:focus { border-color: var(--gold); }
  #reset-config { font-family: 'Nunito', sans-serif; }
  @media (max-width: 640px) { h1::before { width: 34px; height: 34px; } .stats .stat:last-child { grid-column: 1 / -1; } }
</style>
</head>
<body>

<div id="setup-gate">
  <h2>Connect your Google Sheet</h2>
  <p>Paste the Web App URL and passphrase from your Apps Script deployment. This is saved only in this browser — never sent anywhere except your own script.</p>
  <label for="cfg-url">Web app URL</label>
  <input type="text" id="cfg-url" placeholder="https://script.google.com/macros/s/.../exec" />
  <label for="cfg-pass">Passphrase</label>
  <input type="password" id="cfg-pass" placeholder="Your passphrase" />
  <div id="setup-error"></div>
  <div class="actions">
    <button class="btn-ghost" id="cfg-connect" style="flex:1; background: var(--gold); color:#FFFFFF; font-weight:700; border-color: var(--gold);">Connect</button>
  </div>
</div>

<div id="app-content">
  <div class="wrap">

    <div class="tabs">
      <button class="tab-btn active" data-tab="personal">Personal</button>
      <button class="tab-btn" data-tab="shared">Shared</button>
      <button class="tab-btn" data-tab="wishlist">Wishlist</button>
    </div>

    <div id="tab-personal" class="panel-view active"></div>
    <div id="tab-shared" class="panel-view"></div>
    <div id="tab-wishlist" class="panel-view"></div>

  </div>
</div>

<button id="reset-config" title="Disconnect this browser from the sheet">Disconnect sheet</button>

<script>
const PANEL_TEMPLATE = (id, kind) => `
  <div class="topbar">
    <div>
      <p class="eyebrow">${kind === 'personal' ? 'Personal &middot; &#8369; PHP' : 'Shared &middot; &#8369; PHP'}</p>
      <h1 id="${id}-month-title">Expense Ledger</h1>
    </div>
    <div class="month-controls">
      <select id="${id}-month-select"></select>
      <button class="btn-ghost" id="${id}-new-month-btn" title="Add a new month">+ Month</button>
      <button class="btn-ghost icon-btn" id="${id}-sync-btn" title="Re-sync with your sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.3M3 12a9 9 0 0 1 15.5-6.3"/><path d="M21 3v6h-6M3 21v-6h6"/></svg>

const CONFIG_KEY = 'expense-dashboard-config-pink';

const DEFAULT_CONFIG = null;

function getConfig() {
  try {
    const stored = JSON.parse(localStorage.getItem(CONFIG_KEY));
    if (stored && stored.url && stored.pass) return stored;
  } catch (e) {}
  return DEFAULT_CONFIG;
}
function saveConfig(cfg) { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }
function clearConfig() { localStorage.removeItem(CONFIG_KEY); }

async function apiCall(action, key, value) {
  const cfg = getConfig();
  if (!cfg) throw new Error('not configured');
  const params = new URLSearchParams({ action, pass: cfg.pass });
  if (key !== undefined) params.set('key', key);
  if (value !== undefined) params.set('value', value);
  const res = await fetch(cfg.url + '?' + params.toString(), { method: 'GET' });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

const storage = {
  async get(key) {
    const d = await apiCall('get', key);
    return (d.value !== null && d.value !== undefined) ? { value: d.value } : null;
  },
  async set(key, value) {
    await apiCall('set', key, value);
    return { key, value };
  }
};

document.getElementById('cfg-connect').addEventListener('click', async () => {
  const url = document.getElementById('cfg-url').value.trim();
  const pass = document.getElementById('cfg-pass').value;
  const errEl = document.getElementById('setup-error');
  errEl.textContent = '';
  if (!url || !pass) { errEl.textContent = 'Enter both the web app URL and your passphrase.'; return; }
  const btn = document.getElementById('cfg-connect');
  btn.textContent = 'Connecting…';
  try {
    const pingParams = new URLSearchParams({ action: 'ping', pass });
    const res = await fetch(url + '?' + pingParams.toString(), { method: 'GET' });
    const data = await res.json();
    if (data.error) throw new Error(data.error === 'unauthorized' ? 'Wrong passphrase.' : data.error);
    saveConfig({ url, pass });
    document.getElementById('setup-gate').style.display = 'none';
    document.getElementById('app-content').classList.add('ready');
    startApp();
  } catch (e) {
    errEl.textContent = 'Could not connect: ' + e.message + '. Check the URL and passphrase.';
  } finally {
    btn.textContent = 'Connect';
  }
});

document.getElementById('reset-config').addEventListener('click', () => {

});
