<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Expense Ledger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M14 26 L13 9 L25 18 Q32 16 39 18 L51 9 L50 26 Q55 33 53 41 Q50 54 32 54 Q14 54 11 41 Q9 33 14 26Z%22 fill=%22%23FFE3EC%22 stroke=%22%234B2D37%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M17 14 L18 22 L23 19Z M47 14 L46 22 L41 19Z%22 fill=%22%23F7B6C8%22/%3E%3Ccircle cx=%2224%22 cy=%2235%22 r=%222.6%22 fill=%22%234B2D37%22/%3E%3Ccircle cx=%2240%22 cy=%2235%22 r=%222.6%22 fill=%22%234B2D37%22/%3E%3Cpath d=%22M30 40 L34 40 L32 42.5Z%22 fill=%22%23E5789A%22/%3E%3Cpath d=%22M32 42.5 Q30 46 27 45 M32 42.5 Q34 46 37 45%22 fill=%22none%22 stroke=%22%234B2D37%22 stroke-width=%221.8%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M8 38 L19 39 M8 43 L19 42 M56 38 L45 39 M56 43 L45 42%22 stroke=%22%234B2D37%22 stroke-width=%221.5%22 stroke-linecap=%22round%22/%3E%3Cellipse cx=%2219%22 cy=%2241%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22 opacity=%22.8%22/%3E%3Cellipse cx=%2245%22 cy=%2241%22 rx=%223%22 ry=%221.8%22 fill=%22%23F7B6C8%22 opacity=%22.8%22/%3E%3C/svg%3E">

  (function(){ try { var t = localStorage.getItem('expense-theme-pink'); if (t && t !== 'default') document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6F8;
    --panel: #FFFFFF;
    --panel-2: #FFF0F4;
    --line: #F5CFDA;
    --line-soft: #FBE4EB;
    --text: #4B2D37;
    --text-dim: #8E6572;
    --text-faint: #BE96A3;
    --gold: #E5789A;
    --gold-dim: #FDE3EB;
    --teal: #4FB08F;
    --teal-dim: #DDF3EA;
    --red: #D9577A;
    --red-dim: #FCE0E8;
    --violet: #9A7FDB;
    --violet-dim: #EEE7FB;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    padding: 40px 24px 80px;
    padding-left: max(24px, env(safe-area-inset-left));
    padding-right: max(24px, env(safe-area-inset-right));
    padding-bottom: max(80px, env(safe-area-inset-bottom) + 60px);
    overflow-x: hidden;
    min-width: 320px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    align-items: start;
  }
  .main-col { min-width: 0; }
  .side-col { display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 900px) {
    .dash-grid { grid-template-columns: 1fr; }
  }

  .side-card {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 16px;
  }
  .side-card-title {
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 12px;
  }

  .inst-empty { font-size: 12.5px; color: var(--text-faint); line-height: 1.5; }
  .inst-item { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .inst-item:last-child { border-bottom: none; padding-bottom: 0; }
  .inst-item-name { font-size: 13px; font-weight: 500; margin: 0 0 6px; }
  .inst-item-row { display: flex; justify-content: space-between; align-items: center; font-family: 'Nunito', sans-serif; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .inst-progress-track { height: 5px; background: var(--line-soft); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .inst-progress-fill { height: 100%; background: var(--violet); border-radius: 3px; }
  #tab-personal .inst-progress-fill { background: var(--gold); }
  .inst-remaining { font-family: 'Nunito', sans-serif; font-size: 11.5px; color: var(--text); }
  .inst-remaining span { color: var(--text-faint); }

  .cal-header { display: flex; justify-content: center; margin-bottom: 10px; }
  .cal-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; margin: 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { font-family: 'Nunito', sans-serif; font-size: 9px; color: var(--text-faint); text-align: center; padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 5px;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    cursor: default;
    position: relative;
  }
  .cal-day.has-due { cursor: pointer; background: var(--panel-2); color: var(--text); }
  .cal-day.has-due:hover { background: var(--line); }
  .cal-day.armed { outline: 1.5px solid var(--gold); background: var(--gold-dim); color: var(--text); }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--teal); margin-top: 2px; }
  #tab-shared .cal-dot { background: var(--violet); }
  .cal-hint { font-family: 'Nunito', sans-serif; font-size: 10.5px; color: var(--text-faint); margin: 10px 0 0; line-height: 1.5; }
  .cal-hint.armed-hint { color: var(--gold); }


  .tabs { display: flex; gap: 6px; margin-bottom: 20px; }
  .tab-btn {
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--text-dim); border-color: var(--text-faint); }
  .tab-btn.active { color: var(--on-accent, #FFFFFF); font-weight: 700; }
  .tab-btn.active[data-tab="personal"] { background: var(--gold); border-color: var(--gold); }
  .tab-btn.active[data-tab="shared"] { background: var(--violet); border-color: var(--violet); }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .eyebrow {
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  #tab-personal .eyebrow, .accent-gold { color: var(--gold); }
  #tab-shared .eyebrow, .accent-violet { color: var(--violet); }
  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .month-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .icon-btn {
    width: 34px; height: 34px;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .danger-hover:hover { border-color: var(--red-dim); background: var(--red-dim); color: var(--red); }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  button {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--text-faint); background: var(--panel-2); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--text-dim); }
  .btn-ghost:hover { background: var(--panel); border-color: var(--line); color: var(--text); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-label {
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 8px;
  }
  .stat-value {
    font-family: 'Fredoka', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0;
  }
  .stat-sub { font-family: 'Nunito', sans-serif; font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  .stat.remaining .stat-value.g { color: var(--gold); }
  .stat.remaining .stat-value.v { color: var(--violet); }
  .stat.paid .stat-value { color: var(--teal); }

  .progress-track {
    height: 6px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 3px;
    transition: width .3s ease;
  }

  .ledger {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    overflow: hidden;
  }
  .ledger-head {
    display: grid;
    grid-template-columns: 22px 1fr 110px 120px 110px 88px;
    gap: 10px;
    padding: 12px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-faint);
    border-bottom: 1px solid var(--line-soft);
  }
  .row {
    display: grid;
    grid-template-columns: 22px 1fr 110px 120px 110px 88px;
    gap: 10px;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line-soft);
  }
  .row:last-child { border-bottom: none; }
  .row.is-paid { background: rgba(79,203,175,0.045); }
  .row.dragging { opacity: 0.35; }
  .row.drag-over-top { box-shadow: inset 0 2px 0 var(--gold); }
  .row.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--gold); }

  .drag-handle {
    width: 20px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .drag-handle:hover { color: var(--text-dim); }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg { width: 13px; height: 13px; }

  .name-cell input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 5px 6px;
    border-radius: 5px;
  }
  .name-cell input:hover, .name-cell input:focus { background: var(--panel-2); outline: none; }
  .due-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    color: var(--text-faint);
    padding: 1px 6px 0;
  }
  .due-tag input[type="text"] {
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    width: 100%;
    padding: 2px 0;
    flex: 1;
    min-width: 0;
  }
  .due-tag input[type="text"]:hover, .due-tag input[type="text"]:focus { color: var(--text-dim); outline: none; }

  .date-picker-wrap {
    position: relative;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border-radius: 4px;
  }
  .date-picker-wrap:hover { background: var(--panel-2); }
  .date-picker-wrap svg {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 13px;
    height: 13px;
    color: var(--text-faint);
    pointer-events: none;
  }
  .date-picker-wrap.has-date svg { color: var(--teal); }
  #tab-personal .date-picker-wrap.has-date svg { color: var(--gold); }
  .date-picker-wrap input[type="date"] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color-scheme: light;
  }

  .inst-toggle {
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    color: var(--text-faint);
    padding: 3px 6px 0;
    cursor: pointer;
    display: inline-block;
  }
  .inst-toggle:hover { color: var(--gold); }
  .inst-toggle.on { color: var(--violet); }
  #tab-personal .inst-toggle.on { color: var(--gold); }
  .inst-row-fields {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px 0;
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    color: var(--text-faint);
  }
  .inst-row-fields input {
    width: 40px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    padding: 2px 4px;
    border-radius: 4px;
    text-align: center;
  }
  .inst-row-fields input:focus { outline: none; border-color: var(--gold); }

  .amount-cell { display: flex; align-items: center; gap: 3px; }
  .amount-cell span { color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 13px; }
  .amount-cell input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    padding: 6px 7px;
    border-radius: 5px;
    text-align: right;
  }
  .amount-cell input:focus { outline: none; border-color: var(--gold); }

  .paid-cell { display: flex; align-items: center; gap: 8px; }
  .checkbox {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--line);
    background: var(--panel-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .12s;
  }
  .checkbox.checked { background: var(--teal); border-color: var(--teal); }
  .checkbox svg { width: 12px; height: 12px; display: none; }
  .checkbox.checked svg { display: block; }
  .paid-label {
    font-family: 'Nunito', sans-serif;
    font-size: 11.5px;
    color: var(--text-faint);
  }
  .row.is-paid .paid-label { color: var(--teal); }

  .date-cell {
    font-family: 'Nunito', sans-serif;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .date-cell input {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'Nunito', sans-serif;
    font-size: 11.5px;
    width: 100%;
    padding: 2px 0;
  }
  .date-cell input:hover, .date-cell input:focus { color: var(--text); outline: none; }
  .date-cell.empty input { color: var(--text-faint); }

  .del-btn {
    width: 26px; height: 26px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .del-btn:hover { background: var(--red-dim); color: var(--red); }
  .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .act-btn {
    width: 26px; height: 26px; border-radius: 5px; border: none; background: transparent;
    color: var(--text-faint); display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .act-btn:hover { background: rgba(79,203,175,0.14); color: var(--teal); }

  .add-row { padding: 12px 18px; display: flex; }
  .add-row button { width: 100%; border-style: dashed; color: var(--text-dim); }
  .add-row button:hover { color: var(--gold); border-color: var(--gold-dim); }
  #tab-shared .add-row button:hover { color: var(--violet); border-color: var(--violet-dim); }

  .footer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .footer-note {
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    color: var(--text-faint);
  }

  .panel-view { display: none; }
  .panel-view.active { display: block; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(75, 45, 55, 0.35);
    backdrop-filter: blur(2px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  .modal-title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 17px;
    margin: 0 0 10px;
    color: var(--red);
  }
  .modal-body {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.55;
    margin: 0 0 16px;
  }
  .modal-body strong { color: var(--text); font-weight: 600; }
  .modal-input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 6px;
  }
  .modal-input:focus { outline: none; border-color: var(--red); }
  .modal-error { color: var(--red); font-size: 12px; min-height: 16px; margin: 8px 0 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn-danger {
    background: var(--red);
    border-color: var(--red);
    color: #2A1310;
    font-weight: 600;
  }
  .btn-danger:hover { background: #c85a41; border-color: #c85a41; }
  .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; background: var(--red); border-color: var(--red); }

  #setup-gate {
    max-width: 480px;
    margin: 80px auto;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 28px 26px;
  }
  #setup-gate h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    margin: 0 0 6px;
  }
  #setup-gate p { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; margin: 0 0 18px; }
  #setup-gate label {
    display: block;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 14px 0 6px;
  }
  #setup-gate input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
  }
  #setup-gate input:focus { outline: none; border-color: var(--gold); }
  #setup-error { color: var(--red); font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  #setup-gate .actions { display: flex; gap: 8px; margin-top: 20px; }
  #app-content { display: none; }
  #app-content.ready { display: block; }
  #reset-config {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    right: max(16px, env(safe-area-inset-right));
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    color: var(--text-faint);
    background: none; border: none; cursor: pointer;
    opacity: 0.5;
  }
  #reset-config:hover { opacity: 1; }


  /* ===== Tablet (iPad portrait, small laptops) ===== */
  @media (max-width: 900px) {
    body { padding-top: 28px; }
    h1 { font-size: 26px; }
    .topbar { margin-bottom: 22px; }
  }

  /* ===== Phones (iPhone SE through iPhone Pro Max, small Android) ===== */
  @media (max-width: 640px) {
    body { padding: 20px 14px 80px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    h1 { font-size: 22px; }
    .eyebrow { font-size: 10px; }
    .tabs { margin-bottom: 16px; }
    .tab-btn { padding: 10px 14px; font-size: 12.5px; }

    .topbar { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 20px; }
    .month-controls { justify-content: space-between; }
    .month-controls select { flex: 1; min-width: 0; }

    .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 12px 14px; }
    .stat-value { font-size: 19px; }

    .ledger-head { display: none; }
    .row {
      grid-template-columns: 1fr;
      row-gap: 8px;
      padding: 14px 16px;
    }
    .amount-cell, .paid-cell, .date-cell { justify-content: space-between; }
    .amount-cell::before { content: 'Amount'; color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 10px; margin-right: auto; }
    .date-cell::before { content: 'Paid on'; color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 10px; }
    .row-actions { justify-self: end; }

    .side-col { gap: 12px; }
    .cal-day { font-size: 12px; }

    #setup-gate { margin: 40px 16px; padding: 22px 18px; }

    /* Bigger touch targets so fingers can hit them reliably */
    .checkbox { width: 24px; height: 24px; }
    .del-btn, .act-btn { width: 34px; height: 34px; }
    .drag-handle { width: 28px; height: 34px; }
    .date-picker-wrap { width: 24px; height: 24px; }
    button, select { min-height: 40px; }
    .tab-btn { min-height: 40px; }

    /* iOS Safari zooms the whole page in when a focused input has font-size < 16px.
       Force real inputs the user types into up to 16px so focusing them doesn't zoom. */
    .name-cell input,
    .amount-cell input,
    .date-cell input,
    .due-tag input[type="text"],
    .inst-row-fields input,
    #setup-gate input,
    select {
      font-size: 16px;
    }
  }

  /* Very small phones (iPhone SE / mini widths) */
  @media (max-width: 380px) {
    .stats { grid-template-columns: 1fr; }
    .stat-value { font-size: 22px; }
  }

  /* ===== Wishlist tab ===== */
  .tab-btn.active[data-tab="wishlist"] { background: var(--teal); border-color: var(--teal); }
  #tab-wishlist .eyebrow { color: var(--teal); }
  .wl-filter { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 3px; align-items: center; }
  .wl-filter button { font-family: 'Nunito', sans-serif; font-size: 12px; padding: 6px 12px; border-radius: 6px; border: none; background: transparent; color: var(--text-dim); }
  .wl-filter button:hover { background: var(--panel-2); color: var(--text); }
  .wl-filter button.on { background: var(--panel-2); color: var(--text); }
  .wl-c-red { color: var(--red); } .wl-c-violet { color: var(--violet); } .wl-c-teal { color: var(--teal); }

  .wl-add { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 130px auto auto auto; gap: 10px; align-items: center; }
  .wl-field { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 14px; padding: 9px 11px; font-family: 'Nunito', sans-serif; width: 100%; min-width: 0; }
  .wl-field.mono { font-family: 'Nunito', sans-serif; text-align: right; }
  .wl-field::placeholder { color: var(--text-faint); }
  .wl-field:focus { outline: none; border-color: var(--teal); }
  .wl-seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
  .wl-seg button { font-family: 'Nunito', sans-serif; font-size: 11.5px; padding: 6px 10px; border-radius: 4px; border: none; background: transparent; color: var(--text-faint); white-space: nowrap; flex: 1; }
  .wl-seg button:hover { background: var(--line-soft); color: var(--text-dim); }
  .wl-seg button.on[data-v="need"] { background: var(--red-dim); color: var(--red); }
  .wl-seg button.on[data-v="want"] { background: var(--violet-dim); color: var(--violet); }
  .wl-seg button.on[data-v="high"] { background: var(--gold-dim); color: var(--gold); }
  .wl-seg button.on[data-v="med"] { background: var(--line); color: var(--text); }
  .wl-seg button.on[data-v="low"] { background: var(--line-soft); color: var(--text-dim); }
  .wl-add-btn { background: var(--teal); color: var(--on-accent, #FFFFFF); border: none; font-weight: 600; }
  .wl-add-btn:hover { background: #5fc19f; border: none; }
  .wl-add-err { grid-column: 1 / -1; color: var(--red); font-size: 12px; margin: -2px 0 0; display: none; }

  .wl-group-title { display: flex; align-items: baseline; justify-content: space-between; font-family: 'Nunito', sans-serif; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); margin: 0 4px 8px; }
  .wl-group-title b { font-weight: 600; }
  .wl-group-title .tot { color: var(--text-dim); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .wl-list { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; margin-bottom: 22px; }
  .wl-list.need { box-shadow: inset 3px 0 0 var(--red); }
  .wl-list.want { box-shadow: inset 3px 0 0 var(--violet); }
  .wl-empty { padding: 16px 18px; font-size: 13px; color: var(--text-faint); }
  .wl-item { display: grid; grid-template-columns: 22px 1fr 120px 34px; gap: 12px; align-items: center; padding: 10px 16px 10px 18px; border-bottom: 1px solid var(--line-soft); }
  .wl-item:last-child { border-bottom: none; }
  .wl-item.done { background: rgba(79,203,175,0.045); }
  .wl-check { width: 20px; height: 20px; padding: 0; border-radius: 5px; border: 1.5px solid var(--line); background: var(--panel-2); display: flex; align-items: center; justify-content: center; }
  .wl-check.on { background: var(--teal); border-color: var(--teal); }
  .wl-check.on::after { content: ''; width: 9px; height: 5px; border-left: 2px solid var(--on-accent, #FFFFFF); border-bottom: 2px solid var(--on-accent, #FFFFFF); transform: rotate(-45deg) translate(1px,-1px); }
  .wl-main { min-width: 0; }
  .wl-name-row { display: flex; align-items: center; gap: 6px; }
  .wl-name { flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 500; padding: 5px 6px; border-radius: 5px; }
  .wl-name:hover, .wl-name:focus { background: var(--panel-2); outline: none; }
  .wl-item.done .wl-name { text-decoration: line-through; color: var(--text-faint); }
  .wl-meta { display: flex; align-items: center; gap: 8px; padding: 2px 6px 0; flex-wrap: wrap; }
  .wl-pill { font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; border: 1px solid transparent; background: transparent; min-height: 0; line-height: 1.5; }
  .wl-pill.high { background: var(--gold-dim); color: var(--gold); }
  .wl-pill.med { background: var(--panel-2); color: var(--text-dim); border-color: var(--line); }
  .wl-pill.low { color: var(--text-faint); border-color: var(--line-soft); }
  .wl-pill:hover { filter: brightness(1.2); }
  .wl-swap { font-family: 'Nunito', sans-serif; font-size: 10px; color: var(--text-faint); background: none; border: none; padding: 2px 0; min-height: 0; }
  .wl-swap:hover { color: var(--text); background: none; border: none; }
  .wl-note { flex: 1; min-width: 120px; background: transparent; border: none; color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 12px; padding: 2px 0; }
  .wl-note:hover, .wl-note:focus { color: var(--text-dim); outline: none; }
  .wl-note::placeholder { color: var(--line); }
  .wl-item:hover .wl-note::placeholder { color: var(--text-faint); }
  .wl-bought-on { font-family: 'Nunito', sans-serif; font-size: 10.5px; color: var(--teal); }
  .wl-price { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
  .wl-price span { color: var(--text-faint); font-family: 'Nunito', sans-serif; font-size: 13px; }
  .wl-price input { width: 96px; background: transparent; border: 1px solid transparent; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px; padding: 6px 7px; border-radius: 5px; text-align: right; }
  .wl-price input:hover { background: var(--panel-2); border-color: var(--line); }
  .wl-price input:focus { outline: none; background: var(--panel-2); border-color: var(--teal); }
  .wl-item.done .wl-price input { color: var(--text-faint); }
  .wl-del { width: 30px; height: 30px; padding: 0; border: none; background: transparent; color: var(--text-faint); font-size: 18px; line-height: 1; }
  .wl-del:hover { background: var(--red-dim); color: var(--red); border: none; }

  .wl-next { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .wl-next:last-of-type { border-bottom: none; }
  .wl-next .num { font-family: 'Nunito', sans-serif; color: var(--text-faint); margin-right: 8px; }
  .wl-next .pr { font-family: 'Nunito', sans-serif; color: var(--text-dim); white-space: nowrap; }
  .wl-bar-row { margin-bottom: 12px; }
  .wl-bar-row:last-child { margin-bottom: 0; }
  .wl-bar-label { display: flex; justify-content: space-between; font-family: 'Nunito', sans-serif; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .wl-bar { height: 5px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
  .wl-bar i { display: block; height: 100%; border-radius: 3px; transition: width .3s ease; }
  .wl-hint { font-family: 'Nunito', sans-serif; font-size: 10.5px; color: var(--text-faint); line-height: 1.5; margin: 12px 0 0; }

  @media (max-width: 760px) {
    .wl-add { grid-template-columns: 1fr 1fr; }
    .wl-add .wl-name-in, .wl-add .wl-add-btn { grid-column: 1 / -1; }

    .wl-filter { justify-content: space-between; }
    .wl-filter button { flex: 1; min-height: 36px; }
    #tab-wishlist .stat:last-child { grid-column: 1 / -1; }
    .wl-item { grid-template-columns: 24px minmax(0,1fr) auto 34px; grid-template-areas: "chk name name del" "chk meta price del"; column-gap: 8px; row-gap: 2px; padding: 12px 10px 12px 14px; }

    .wl-check { grid-area: chk; align-self: start; margin-top: 6px; }

    .wl-name-row { min-width: 0; }
    .wl-price { grid-area: price; align-self: start; }

  /* ================= KINGDOM HEARTS ================= */
  html[data-theme="kh"] body { --on-accent: #120A2A; background-attachment: fixed; }
  /* Personal: starry night over the islands */
  html[data-theme="kh"] body[data-tab="personal"] {
    --bg:#070B24; --panel:rgba(18,22,64,.78); --panel-2:rgba(34,40,98,.7); --line:#3A3F8F; --line-soft:#272C6B;
    --text:#F3F1FF; --text-dim:#B9B6E6; --text-faint:#7C79B4;
    --gold:#F3D27A; --gold-dim:#4A3E1C; --teal:#7FE0FF; --teal-dim:#16395A; --red:#FF6F91; --red-dim:#4A1C3A; --violet:#B8A4FF; --violet-dim:#2F2766;
    --sky: linear-gradient(180deg, #050821 0%, #121A55 55%, #2A2A7A 100%);
  }

  html[data-theme="pokopia"] body { background: var(--sky); background-attachment: fixed; font-weight: 600; }

  html[data-theme="pokopia"] .side-card-title::before { background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M3 21 C3 9 11 3 22 3 C22 15 15 21 3 21Z%22 fill=%22%236CC24A%22 stroke=%22%233F8F2A%22 stroke-width=%221.5%22/%3E%3Cpath d=%22M5 19 L15 9%22 stroke=%22%233F8F2A%22 stroke-width=%221.5%22 stroke-linecap=%22round%22/%3E%3C/svg%3E") center/contain no-repeat; width: 16px; height: 16px; }

  /* ================= RESPONSIVE: TABLET + PHONE ================= */
  /* ---- Tablet (iPad portrait / small laptops) ---- */
  @media (min-width: 641px) and (max-width: 1024px) {
    body { padding: 28px 22px 80px; }
    .wrap { max-width: 980px; }
    .dash-grid { grid-template-columns: 1fr; gap: 16px; }
    .side-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    .ledger-head, .row { grid-template-columns: 20px minmax(0,1fr) 112px 104px 104px 84px; gap: 8px; padding-left: 14px; padding-right: 14px; }
    .stats { gap: 10px; }
    .stat { padding: 14px 16px; }
    .stat-value { font-size: 22px; }
    .wl-add { grid-template-columns: 1fr 120px auto auto auto; }
  }
  /* phones + iPads: 'Disconnect sheet' sits at the bottom of the page instead of floating over content */
  @media (max-width: 1366px) {
    #reset-config { position: static; display: block; margin: 24px auto 0; opacity: .7; }
  }
  /* iPad landscape: keep the sidebar but slimmer */
  @media (min-width: 901px) and (max-width: 1180px) {
    .dash-grid { grid-template-columns: minmax(0,1fr) 270px; }
  }
  @media (min-width: 901px) and (max-width: 1024px) {
    .dash-grid { grid-template-columns: minmax(0,1fr) 260px; }
    .side-col { display: flex; flex-direction: column; }
    .ledger-head, .row { grid-template-columns: 20px minmax(0,1fr) 104px 96px 96px 80px; }
  }

  /* ---- Phone ---- */
  @media (max-width: 640px) {
    body { padding: 16px 12px 72px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
    .tabs { gap: 6px; margin-bottom: 14px; }
    .tabs .tab-btn { flex: 1 1 0; min-width: 0; padding: 8px 6px; min-height: 38px; text-align: center; }
    .theme-pick { width: 100%; margin: 2px 0 0; }
    .theme-pick span { display: none; }
    .theme-pick select { flex: 1; min-height: 36px; font-size: 14px; padding: 6px 10px; }
    .topbar { margin-bottom: 14px; gap: 10px; }
    .month-controls { flex-wrap: nowrap; gap: 4px; }
    .month-controls .btn-ghost:not(.icon-btn) { padding: 8px 8px; white-space: nowrap; }

    /* stats: three compact tiles in one row */
    .stats { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin-bottom: 14px; }
    .stats .stat:last-child { grid-column: auto; }
    .stat { padding: 10px 10px 11px; min-width: 0; }
    .stat-label { font-size: 9px; letter-spacing: .06em; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-value { font-size: 16px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-sub { font-size: 10px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .progress-track { margin-top: 7px; height: 5px; }

    /* expense rows: compact 2-3 line cards */
    .ledger-head { display: none; }
    .row {
      grid-template-columns: 30px minmax(0,1fr) auto;
      grid-template-areas: "chk name amt" "chk due act" "chk inst paid" "chk instf instf";
      column-gap: 10px; row-gap: 2px; padding: 12px 12px 10px 12px; align-items: center;
    }
    .name-cell, .paid-cell { display: contents; }
    .name-cell > input { grid-area: name; font-size: 15px; text-overflow: ellipsis; font-weight: 600; padding: 4px 4px; min-width: 0; }
    .due-tag { grid-area: due; padding: 0 4px; min-width: 0; }
    .due-tag input[type="text"] { font-size: 13px !important; }
    .inst-toggle { grid-area: inst; padding: 2px 4px 0; font-size: 11px; justify-self: start; }
    .inst-row-fields { grid-area: instf; padding: 4px 4px 0; }
    .inst-row-fields input { font-size: 13px !important; width: 46px; padding: 3px 4px; }
    .checkbox { grid-area: chk; align-self: start; margin-top: 4px; width: 26px; height: 26px; }
    .drag-handle { grid-area: chk; align-self: end; justify-self: center; width: 26px; height: 26px; }
    .paid-label { display: none; }
    .amount-cell { grid-area: amt; justify-content: flex-end; gap: 2px; }
    .amount-cell::before { content: none !important; }
    .amount-cell input { width: 86px; font-size: 15px !important; font-weight: 600; padding: 6px 8px; }
    .date-cell { grid-area: paid; justify-self: end; justify-content: flex-end; }
    .date-cell::before { content: none !important; }
    .date-cell.empty { display: none; }
    .date-cell input { font-size: 11.5px !important; text-align: right; width: 120px; }
    .row.is-paid .date-cell input { color: var(--teal); }
    .row-actions { grid-area: act; justify-self: end; gap: 0; }
    .row-actions .act-btn, .row-actions .del-btn { width: 32px; height: 32px; min-height: 0; }
    .add-row { padding: 10px 12px; }
    .add-row button { min-height: 42px; }
    .footer-actions { gap: 8px; }
    .footer-note { font-size: 11px; }
    #reset-config { position: static; display: block; margin: 18px auto 0; opacity: .7; }

    /* side cards */
    .side-col { gap: 10px; }
    .side-card { padding: 14px; }
    .cal-day { font-size: 12px; }

    /* wishlist rows: slightly tighter */
    .wl-add { padding: 12px; gap: 8px; }
    .wl-item { padding: 10px 8px 10px 12px; }
    .wl-name { font-size: 15.5px !important; font-weight: 600; }
    .wl-note { font-size: 13px !important; }
    .wl-price input { font-size: 15px !important; font-weight: 600; }
    .wl-field { font-size: 15px !important; }
  }
  @media (max-width: 360px) {
    .stat-value { font-size: 14px !important; }
    .amount-cell input { width: 88px; }
  }

  html[data-theme] .ledger { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; transform: none; filter: none; }
  html[data-theme="kh"] .ledger { background-color: rgba(14,16,48,.92); }
  html[data-theme="kh"] body[data-tab="shared"] .ledger { background-color: rgba(38,14,48,.92); }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .row-menu .menu-item { display: flex !important; align-items: center; justify-content: flex-start !important; gap: 10px; width: 100% !important; height: auto !important;
    min-height: 40px; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; }
  .row-menu .menu-item svg { width: 17px !important; height: 17px !important; flex-shrink: 0; color: var(--text-dim); }
  .row-menu .menu-item:hover { background: var(--panel-2); }
  .row-menu .menu-item.danger, .row-menu .menu-item.danger svg { color: var(--red); }
  .row-menu .menu-item.danger:hover { background: var(--red-dim); }
  .row-menu .menu-sep { height: 1px; background: var(--line-soft); margin: 4px 6px; }
  .row-menu .due-item span { flex: 1; }
  .row-menu .due-item input[type="date"] { width: 132px; flex-shrink: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; color: var(--text);
    font-family: inherit; font-size: 13px; padding: 5px 6px; color-scheme: dark; min-height: 0; }
  html[data-theme="arsenal"] body[data-tab="wishlist"] .row-menu .due-item input[type="date"], html[data-theme="pokopia"] .row-menu .due-item input[type="date"] { color-scheme: light; }
  .row-menu .due-item input[type="date"]:focus { outline: none; border-color: var(--gold); }

  /* actions column is now one small button */
  .ledger-head, .row { grid-template-columns: 22px minmax(0,1fr) 110px 120px 110px 44px; }
  @media (min-width: 641px) and (max-width: 1024px) { .ledger-head, .row { grid-template-columns: 20px minmax(0,1fr) 112px 104px 108px 44px; } .more-btn { width: 38px; height: 38px; } }
  @media (min-width: 901px) and (max-width: 1024px) { .ledger-head, .row { grid-template-columns: 20px minmax(0,1fr) 104px 96px 100px 44px; } }
  @media (pointer: coarse) and (min-width: 1025px) { .ledger-head, .row { grid-template-columns: 20px minmax(0,1fr) 108px 110px 110px 44px; } .more-btn { width: 38px; height: 38px; } .row-menu .menu-item { min-height: 46px; font-size: 15px; } }
  @media (pointer: coarse) { .row-menu .menu-item { min-height: 46px; font-size: 15px; } .row-menu .due-item input[type="date"] { font-size: 16px; } }
  @media (max-width: 640px) {
    .row { grid-template-columns: 30px minmax(0,1fr) auto !important;
      grid-template-areas: "chk name act" "chk due amt" "chk inst inst" "chk instf instf" "chk paid paid" !important; }
    .row-actions { grid-area: act; align-self: center; }
    .more-btn { width: 38px; height: 38px; }
    .due-tag { display: flex; align-items: center; gap: 8px; }
    .due-chip { font-size: 13px; }
    .row-menu { min-width: 240px; }
  }

  /* ================= MONEY BOXES (room for 123,456.78) ================= */
  .amount-cell input { font-variant-numeric: tabular-nums; }
  .wl-price input { width: 112px; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .amount-cell input { width: 124px !important; }
    .wl-price input { width: 112px !important; }
    .wl-item { grid-template-columns: 24px minmax(0,1fr) auto 34px !important; }
  }
  @media (max-width: 360px) { .amount-cell input { width: 108px !important; } }
  @media (max-width: 640px) {
    /* name runs over the amount column; only the ⋯ button sits beside it */
    .row { grid-template-columns: 30px minmax(0,1fr) auto 40px !important;
      grid-template-areas: "chk name name act" "chk due amt amt" "chk inst inst inst" "chk instf instf instf" "chk paid paid paid" !important; }
    .row-actions { justify-self: end; }
  }

  /* phone: 'Due Nov 3' label moves to the right of the '+ Installment' line so notes keep their room */
  @media (max-width: 640px) {
    .row .due-tag { display: contents !important; }
    .row .due-tag input[type="text"] { grid-area: due; min-width: 0; padding: 0 4px; }
    .row .due-chip { grid-area: chip; justify-self: end; align-self: center; padding-right: 2px; }
    .row { grid-template-areas: "chk name name act" "chk due amt amt" "chk inst chip chip" "chk instf instf instf" "chk paid paid paid" !important; }
  }

  html[data-theme="kh"] body[data-tab="shared"] { --kh-emblem: var(--kh-crown); }
  html[data-theme="kh"] body[data-tab="wishlist"] { --kh-emblem: var(--kh-wayfinder); }
  /* title: heart + crown logo */
  html[data-theme="kh"] h1::before { background: var(--kh-logo) center/contain no-repeat !important; width: 40px; height: 50px; filter: drop-shadow(0 0 10px rgba(80,170,255,.45)); }
  /* big faint emblem behind the header (replaces the stained-glass disc) */
  html[data-theme="kh"] .wrap::before { background: var(--gold) !important; opacity: .09 !important; border-radius: 0 !important;
    -webkit-mask: var(--kh-emblem) center/contain no-repeat !important; mask: var(--kh-emblem) center/contain no-repeat !important;
    width: 300px !important; height: 280px !important; top: -30px !important; left: auto !important; right: -20px !important; }
  /* card titles: crown / Mickey silhouettes in gold */
  html[data-theme="kh"] .side-card-title::before { display: block !important; content: '' !important; width: 18px !important; height: 14px !important; background: var(--gold) !important;
    -webkit-mask: var(--kh-crown) center/contain no-repeat; mask: var(--kh-crown) center/contain no-repeat; }
  html[data-theme="kh"] .side-card:nth-child(2) .side-card-title::before { -webkit-mask-image: var(--kh-mickey); mask-image: var(--kh-mickey); width: 18px !important; height: 13px !important; }
  /* Kingdom Key lying on top of the expense / wishlist list */
  html[data-theme="kh"] .stats { position: relative; margin-bottom: 44px; }
  html[data-theme="kh"] .stats::after { content: ''; position: absolute; right: 34px; bottom: -50px; width: 78px; height: 70px; z-index: 3; pointer-events: none;
    background: var(--kh-pixelkey) center/contain no-repeat; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)) drop-shadow(0 0 10px rgba(255,200,60,.35)); }
  /* pixel Keyblade on the add buttons */
  html[data-theme="kh"] .add-row button::before, html[data-theme="kh"] .wl-add-btn::before { content: ''; display: inline-block; width: 22px; height: 20px; margin-right: 8px; vertical-align: -4px;
    background: var(--kh-pixelkey) center/contain no-repeat; image-rendering: pixelated; }
  html[data-theme="kh"] .wl-add-btn { display: inline-flex; align-items: center; justify-content: center; }
  html[data-theme="kh"] .wl-add-btn::before { margin-right: 6px; }
  @media (max-width: 640px) {
    html[data-theme="kh"] h1::before { width: 32px !important; height: 40px !important; }
    html[data-theme="kh"] .wrap::before { width: 190px !important; height: 180px !important; right: -30px !important; top: -10px !important; }
    html[data-theme="kh"] .stats { margin-bottom: 30px; }
    html[data-theme="kh"] .stats::after { width: 60px; height: 54px; bottom: -40px; right: 24px; }
  }

  /* ================= KH sound toggle ================= */
  .sound-toggle { display: none; width: 36px; height: 36px; padding: 0; margin-left: auto; align-items: center; justify-content: center; border-radius: 999px; font-size: 16px; line-height: 1; }
  .sound-toggle .off { display: none; }
  .sound-toggle.muted .on { display: none; }
  .sound-toggle.muted .off { display: inline; }
  .sound-toggle.muted { opacity: .6; }
  html[data-theme="kh"] .sound-toggle { display: inline-flex; border: 1px solid rgba(243,210,122,.45); background: rgba(0,0,0,.25); }
  html[data-theme="ff"] .sound-toggle { display: inline-flex; background: var(--win); border: 2px solid var(--win-edge); border-radius: 6px; }
  html[data-theme="ff"] .sound-toggle + .theme-pick { margin-left: 8px; }
  html[data-theme="kh"] .sound-toggle + .theme-pick { margin-left: 8px; }
  @media (max-width: 640px) {
    html:is([data-theme="kh"],[data-theme="ff"],[data-theme="zelda"],[data-theme="pokopia"]) .tabs .tab-btn { flex: 1 1 28%; }
    html:is([data-theme="kh"],[data-theme="ff"],[data-theme="zelda"],[data-theme="pokopia"]) .sound-toggle { order: 2; width: 40px; height: 36px; margin-left: 0; flex: 0 0 40px; }
    html:is([data-theme="kh"],[data-theme="ff"],[data-theme="zelda"],[data-theme="pokopia"]) .theme-pick { order: 1; width: auto; flex: 1 1 calc(100% - 46px); margin-left: 0 !important; }
    html:is([data-theme="kh"],[data-theme="ff"],[data-theme="zelda"],[data-theme="pokopia"]) .tabs { row-gap: 6px; }
  }
  /* ===== Expense name: slightly different shade, follows the theme ===== */
  .row, .wl-item { --name-accent: var(--gold); }
  #tab-shared .row { --name-accent: var(--violet); }
  .wl-item { --name-accent: var(--teal); }
  .name-cell > input[data-field="name"], .wl-name {
    color: color-mix(in srgb, var(--name-accent) 55%, var(--text)) !important;
    font-weight: 700;
  }

  /* ================= POKOPIA 2: Pokédex menu look ================= */
  html[data-theme="pokopia"] body { --dex:#E2615D; --dex-dark:#C44B48; --dex-ring:#FFD83A; --soft:#EFEFEC; --ink:#4A4744; }
  html[data-theme="pokopia"] body[data-tab="personal"] { --chk1:#BFE6A2; --chk2:#CDEDB3; }
  html[data-theme="pokopia"] body[data-tab="shared"]   { --chk1:#B8E2F5; --chk2:#C9EAF8; }

<script>
const PANEL_TEMPLATE = (id, kind) => `
  <div class="topbar">
    <div>
      <p class="eyebrow">${kind === 'personal' ? 'Personal &middot; &#8369; PHP' : 'Shared &middot; &#8369; PHP'}</p>
      <h1 id="${id}-month-title">Expense Ledger</h1>
    </div>
    <div class="month-controls">
      <select id="${id}-month-select"></select>
      <button class="btn-ghost" id="${id}-new-month-btn" title="Add a new month">+ Month</button>
      <button class="btn-ghost icon-btn" id="${id}-sync-btn" title="Re-sync with your sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.3M3 12a9 9 0 0 1 15.5-6.3"/><path d="M21 3v6h-6M3 21v-6h6"/></svg>
      </button>
      <button class="btn-ghost icon-btn danger-hover" id="${id}-delete-month-btn" title="Delete this month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
      </button>

  </div>

  <div class="dash-grid">

        <div class="stat paid">

          <p class="stat-value" id="${id}-stat-paid">&#8369;0</p>
          <div class="progress-track"><div class="progress-fill" id="${id}-progress-fill" style="width:0%"></div></div>
        </div>
        <div class="stat remaining">
          <p class="stat-label">Left to pay</p>
          <p class="stat-value ${kind === 'personal' ? 'g' : 'v'}" id="${id}-stat-remaining">&#8369;0</p>

          <div></div>
        </div>
        <div id="${id}-rows"></div>
        <div class="add-row">
          <button id="${id}-add-expense-btn">+ Add expense</button>
        </div>
      </div>

      <div class="footer-actions">
        <span class="footer-note" id="${id}-save-note">Saved automatically to this browser</span>
        <button class="btn-ghost" id="${id}-dup-btn">Copy previous month &rarr;</button>
      </div>
    </div>

    <div class="side-col">
      <div class="side-card">
        <p class="side-card-title">Installments</p>
        <div id="${id}-installments"></div>
      </div>
      <div class="side-card">
        <p class="side-card-title">Payment calendar</p>
        <div class="cal-header"><p class="cal-title" id="${id}-cal-title">Month</p></div>
        <div class="cal-grid" id="${id}-cal-grid"></div>
        <p class="cal-hint" id="${id}-cal-hint">Click a due date, then click a new date to move it.</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="${id}-delete-modal">
    <div class="modal-box">
      <p class="modal-title" id="${id}-delete-step1-title">Delete this month?</p>
      <div id="${id}-delete-step1">
        <p class="modal-body" id="${id}-delete-step1-body">This will permanently remove this month and everything in it. This can't be undone.</p>
        <div class="modal-actions">
          <button class="btn-ghost" id="${id}-delete-cancel-1">Cancel</button>
          <button class="btn-danger" id="${id}-delete-continue">Continue</button>
        </div>
      </div>
      <div id="${id}-delete-step2" style="display:none">
        <p class="modal-body">To confirm, type <strong id="${id}-delete-confirm-label"></strong> below.</p>
        <input type="text" id="${id}-delete-confirm-input" class="modal-input" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <p class="modal-error" id="${id}-delete-error"></p>
        <div class="modal-actions">
          <button class="btn-ghost" id="${id}-delete-cancel-2">Cancel</button>
          <button class="btn-danger" id="${id}-delete-confirm-btn" disabled>Delete month</button>
        </div>
